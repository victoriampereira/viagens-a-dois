<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viagens a Dois</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Viagens a Dois">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="icon" type="image/png" href="icon-192.png?v=4">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#FFFFFF; --fill:#F2F2F7; --fill2:#E5E5EA; --ink:#141414; --muted:#8E8E93; --muted2:#3C3C43; --sep:#D1D1D6;
  --acc:#2453A6; --acc-soft:#EAF0FB;
  --s:#1B2430; --v:#6E9BE8; --v-ink:#10233F;
  --ok:#1F7A42; --warn:#B4540A; --warn-soft:#FDF1E4; --danger:#C4372B;
  --font:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --tab:84px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.4;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--acc);text-decoration:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(var(--tab) + env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.nav{display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:17px}
.nav a,.nav button{color:var(--acc);background:none;border:0;padding:10px 0;cursor:pointer;display:flex;align-items:center;gap:2px;font-size:17px}
h1.t{margin:0;font-weight:800;font-size:34px;letter-spacing:-.035em;line-height:1.1}
.sub{font-size:15px;color:var(--muted);margin-top:-10px}
.card{background:var(--fill);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.hl{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.big{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.bar{height:8px;border-radius:99px;background:var(--fill2);display:flex;overflow:hidden;position:relative}
.bar>span{display:block;height:100%}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{background:var(--fill);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.mini .ml{font-size:13px;color:var(--muted)} .mini b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;color:#fff}
.av.S{background:var(--s)} .av.V{background:var(--v);color:var(--v-ink)}
.av.lg{width:52px;height:52px;font-size:19px}
.grp{background:var(--fill);border-radius:14px;padding-left:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px 10px 0;border-bottom:.5px solid var(--sep);color:inherit;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row .tx{flex:1;display:flex;flex-direction:column;min-width:0}
.row .tx b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{font-size:13px;color:var(--muted)}
.row .val{font-size:16px;color:var(--muted2);white-space:nowrap}
.row .val.strong{color:var(--ink);font-weight:600}
.chev{flex:none;color:#C4C4C7}
.tile{width:30px;height:30px;border-radius:8px;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.sh{font-size:13px;color:var(--muted);text-transform:uppercase;margin:8px 0 -8px 16px;letter-spacing:.01em}
.foot{font-size:13px;color:var(--muted);margin:-6px 16px 0}
.seg{display:grid;background:#EEEEF0;border-radius:9px;padding:2px}
.seg button{height:32px;border:0;background:transparent;font-size:13px;font-weight:600;border-radius:7px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.now{background:var(--acc-soft);color:var(--acc)} .tag.plan{background:var(--fill2);color:var(--muted2)}
.tag.ok{color:var(--ok);background:#E3F1E8} .tag.end{color:var(--muted2);background:var(--fill2)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.S{background:var(--s)} .dot.V{background:var(--v)}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px}
.btn{height:52px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:17px;font-weight:700;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn:disabled{opacity:.6}
.btn-plain{height:46px;border:0;background:transparent;color:var(--acc);font-size:16px;font-weight:600;width:100%;cursor:pointer}
.danger{color:var(--danger)!important}
.amount{border:0;background:transparent;text-align:center;width:100%;font-size:52px;font-weight:800;letter-spacing:-.04em;padding:0;outline:none;color:var(--ink)}
.amount::placeholder{color:#C7C7CC}
.fin{flex:1;border:0;background:transparent;font-size:16px;text-align:right;outline:none;min-width:0;color:var(--muted2);padding:0}
.fin::placeholder{color:#C7C7CC}
.fin.left{text-align:left;color:var(--ink)}
select.fin{-webkit-appearance:none;appearance:none;cursor:pointer;text-align:right;text-align-last:right}
input[type=date].fin{-webkit-appearance:none;appearance:none;min-height:24px}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cats button{height:70px;border:0;border-radius:14px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.cats button[aria-pressed="true"]{background:var(--acc);color:#fff}
.sw{width:51px;height:31px;border:0;border-radius:999px;background:var(--fill2);position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .15s}
.sw[aria-pressed="true"]{background:var(--acc)}
.sw[aria-pressed="true"]::after{left:22px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);background:rgba(249,249,249,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:.5px solid var(--sep);padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));z-index:10}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--muted);min-height:48px;justify-content:center}
.tabbar a.on{color:var(--acc)}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) - 6px);width:min(480px,100%);padding:12px 16px 10px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 35%);display:flex;flex-direction:column;gap:6px;z-index:5}
.hint{font-size:13px;color:var(--muted);text-align:center}
.empty{padding:20px 16px;color:var(--muted);text-align:center;font-size:15px}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(16px);bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 80px);background:rgba(20,20,20,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:min(480px,100%);border-radius:14px 14px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:20px;font-weight:800;text-align:center}
.grab{width:36px;height:5px;border-radius:999px;background:#D1D1D6;align-self:center}
.spin{width:28px;height:28px;border:3px solid var(--fill2);border-top-color:var(--acc);border-radius:50%;animation:r 1s linear infinite;margin:38vh auto 0}
@keyframes r{to{transform:rotate(360deg)}}
input[type=range]{width:100%;accent-color:var(--acc)}
</style>
</head>
<body>
<div id="app"><div class="spin" role="status" aria-label="Carregando"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const SB_URL = 'https://exfyhevmtpuxnmaifcuw.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4ZnloZXZtdHB1eG5tYWlmY3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNTc5MzksImV4cCI6MjEwODYzMzkzOX0.KS56ZtUqoK3PB0iYlI36Tt-mFAiAKcEErSZ_t0F5KzE';
const NOME = { S: 'Sérgio', V: 'Victoria' };

/* ---------- utilidades ---------- */
const $app = document.getElementById('app');
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((Number(n)||0) * 100) / 100;
function brl(n, cents){
  n = r2(n);
  const temCent = cents || Math.round(Math.abs(n)*100) % 100 !== 0;
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: temCent ? 2 : 0, maximumFractionDigits: 2 });
}
function parseValor(s){
  s = String(s||'').replace(/[^\d,.-]/g,'');
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s); return isFinite(n) ? r2(n) : 0;
}
function hojeISO(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function dataObj(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function diasEntre(a,b){ return Math.round((dataObj(b) - dataObj(a)) / 86400000); }
function fmtDia(iso){ const d = dataObj(iso); return d.getDate() + ' ' + MESES[d.getMonth()]; }
function fmtPeriodo(v){
  if (!v.inicio) return '';
  const a = dataObj(v.inicio), b = v.fim ? dataObj(v.fim) : null, ano = new Date().getFullYear();
  const y = (b || a).getFullYear() !== ano ? ' ' + (b || a).getFullYear() : '';
  if (!b) return a.getDate() + ' ' + MESES[a.getMonth()] + y;
  if (a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()) return a.getDate() + ' – ' + b.getDate() + ' ' + MESES[b.getMonth()] + y;
  return a.getDate() + ' ' + MESES[a.getMonth()] + ' – ' + b.getDate() + ' ' + MESES[b.getMonth()] + y;
}
function fmtGrupo(iso){
  const dd = diasEntre(iso, hojeISO());
  if (dd === 0) return 'Hoje';
  if (dd === 1) return 'Ontem';
  const d = dataObj(iso);
  return d.getDate() + ' ' + MESES[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function toast(msg, ms){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms || 2600);
}

/* ---------- ícones ---------- */
const sv = (p, w=24, sw=1.8) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC = {
  voltar: '<path d="M15 18l-6-6 6-6"/>', seta: '<path d="M9 6l6 6-6 6"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  mala: '<rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M4 12h16"/>',
  mais: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  troca: '<path d="M7 7h13l-4-4M17 17H4l4 4"/>',
  ajuste: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  aviso: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',
  comida: '<path d="M7 3v7a2 2 0 0 0 2 2v9M11 3v7M17 3c-2 2-2 6 0 8v10"/>',
  transporte: '<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21l1.5-4M16 21l-1.5-4"/>',
  hospedagem: '<path d="M3 19V6M3 14h18v5M21 14a3 3 0 0 0-3-3h-7v3"/><circle cx="7" cy="11" r="1.5"/>',
  passeios: '<path d="M4 9l8-5 8 5v2H4z"/><path d="M6 11v7M10 11v7M14 11v7M18 11v7M3 20h18"/>',
  compras: '<path d="M5 8h14l-1 13H6L5 8z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  outros: '<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>'
};
const CHEV = `<svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>`;
const CATS = [
  { id:'comida', nome:'Comida' }, { id:'transporte', nome:'Transporte' }, { id:'hospedagem', nome:'Hospedagem' },
  { id:'passeios', nome:'Passeios' }, { id:'compras', nome:'Compras' }, { id:'outros', nome:'Outros' }
];
const catNome = id => (CATS.find(c => c.id === id) || CATS[5]).nome;

/* ---------- dados ---------- */
let chave = store.get('vd_chave');
let D = { viagens: [], gastos: [], acertos: [] };
let carregado = false;
let eu = store.get('vd_eu');

async function rpc(fn, args){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ p_chave: chave }, args || {}))
  });
  const txt = await r.text();
  let body = null; try { body = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!r.ok) { const e = new Error((body && body.message) || 'Erro ao falar com o servidor'); e.status = r.status; e.code = body && body.code; throw e; }
  return body;
}
async function carregar(silencioso){
  try {
    const novo = await rpc('vd_dados');
    const mudou = JSON.stringify(novo) !== JSON.stringify(D);
    D = novo; carregado = true;
    if (mudou || !silencioso) render();
  } catch(e) {
    if (e.code === '28000') { chave = null; store.set('vd_chave', null); render(); return; }
    if (!silencioso) { carregado = true; render(); toast('Sem conexão. Tentando de novo…'); }
  }
}
function viagem(id){ return D.viagens.find(v => v.id === id); }
function gastosDe(id){ return D.gastos.filter(g => g.viagem_id === id); }
function parteS(g){ return g.divisao === 'metade' ? 0.5 : g.divisao === 'pagador' ? (g.pagou === 'S' ? 1 : 0) : Number(g.parte_s); }
function resumo(id){
  const gs = gastosDe(id);
  let total = 0, pagoS = 0, pagoV = 0, devidoS = 0;
  const cat = {}; CATS.forEach(c => cat[c.id] = 0);
  gs.forEach(g => {
    const v = Number(g.valor); total += v;
    if (g.pagou === 'S') pagoS += v; else pagoV += v;
    devidoS += v * parteS(g);
    cat[g.categoria] = (cat[g.categoria] || 0) + v;
  });
  const acs = D.acertos.filter(a => a.viagem_id === id);
  let saldoS = pagoS - devidoS;
  acs.forEach(a => { saldoS += a.de === 'V' ? -Number(a.valor) : Number(a.valor); });
  return { gs, total: r2(total), pagoS: r2(pagoS), pagoV: r2(pagoV), parteS: r2(devidoS), parteV: r2(total - devidoS), saldoS: r2(saldoS), cat, acs };
}
function status(v){
  const h = hojeISO();
  if (v.inicio && v.inicio > h) return 'plan';
  if (v.inicio && (!v.fim || v.fim >= h)) return 'now';
  const r = resumo(v.id);
  return (r.gs.length && Math.abs(r.saldoS) < 0.01) ? 'ok' : 'end';
}
const STATUS_TXT = { now:'Em andamento', plan:'Planejada', ok:'Acertada', end:'Encerrada' };
function destaque(){
  const now = D.viagens.find(v => status(v) === 'now'); if (now) return now;
  return D.viagens.filter(v => status(v) === 'plan').sort((a,b) => a.inicio < b.inicio ? -1 : 1)[0] || null;
}
function idAtual(){
  const salvo = store.get('vd_atual'); if (salvo && viagem(salvo)) return salvo;
  const d = destaque(); if (d) return d.id;
  return D.viagens[0] ? D.viagens[0].id : null;
}
function alertaDe(v, r){
  if (!v.alerta_ligado || !(Number(v.limite) > 0)) return null;
  const pct = r.total / Number(v.limite) * 100;
  if (pct >= 100) return `Vocês passaram do limite: ${brl(r.total)} de ${brl(v.limite)}.`;
  if (pct >= v.alerta_pct) return `Atenção: já usaram ${Math.floor(pct)}% do limite. Restam ${brl(Number(v.limite) - r.total)}.`;
  return null;
}
function fraseSaldo(r){
  if (Math.abs(r.saldoS) < 0.01) return 'Tudo acertado entre vocês';
  return r.saldoS > 0 ? `Victoria deve ${brl(r.saldoS)} ao Sérgio` : `Sérgio deve ${brl(-r.saldoS)} à Victoria`;
}
function barra(r, lim){
  const base = Math.max(Number(lim)||0, r.total) || 1;
  return `<div class="bar"><span style="width:${r.pagoS/base*100}%;background:var(--s)"></span><span style="width:${r.pagoV/base*100}%;background:var(--v)"></span></div>`;
}
const divTxt = g => g.divisao === 'metade' ? 'metade cada' : g.divisao === 'pagador' ? (g.pagou === 'S' ? 'só dele' : 'só dela') : `${Math.round(parteS(g)*100)}/${100-Math.round(parteS(g)*100)}`;

function tabbar(on){
  const a = idAtual();
  const t = (href, key, ic, txt) => `<a href="${href}" class="${on===key?'on':''}" ${on===key?'aria-current="page"':''}>${sv(IC[ic],26,1.7)}${txt}</a>`;
  return `<nav class="tabbar" aria-label="Navegação">
    ${t('#/', 'viagens', 'mala', 'Viagens')}
    ${t(a ? '#/novo/'+a : '#/nova-viagem', 'novo', 'mais', 'Lançar')}
    ${t(a ? '#/acerto/'+a : '#/nova-viagem', 'acerto', 'troca', 'Acerto')}
    ${t(a ? '#/limite/'+a : '#/nova-viagem', 'limite', 'ajuste', 'Limite')}
  </nav>`;
}

/* ---------- telas ---------- */
function telaEntrar(){
  $app.innerHTML = `
  <div style="height:40px"></div>
  <h1 class="t">Viagens a Dois</h1><div class="sub" style="margin-top:-6px">Gastos de viagem do Sérgio e da Victoria</div>
  <form id="f-entrar" style="display:flex;flex-direction:column;gap:14px;margin-top:10px">
    <div class="grp"><label class="row" style="cursor:text"><span class="tx" style="flex:none"><b>Código</b></span>
      <input class="fin" id="cod" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Código do casal"></label></div>
    <div class="foot">Pode colar o link do casal inteiro. Fica salvo neste celular.</div>
    <button class="btn" type="submit">Entrar</button>
  </form>`;
  document.getElementById('f-entrar').onsubmit = async ev => {
    ev.preventDefault();
    const c = document.getElementById('cod').value.trim().replace(/^.*#k=/, '');
    if (!c) return;
    chave = c;
    try { await rpc('vd_dados'); store.set('vd_chave', c); location.hash = '#/'; carregar(); }
    catch(e){ chave = null; toast(e.code === '28000' ? 'Código não encontrado' : 'Sem conexão'); }
  };
}

function telaViagens(){
  const dest = destaque();
  const outras = D.viagens.filter(v => !dest || v.id !== dest.id);
  let cartao = '';
  if (dest) {
    const r = resumo(dest.id), lim = Number(dest.limite) || 0, st = status(dest);
    let linha;
    if (st === 'now') { const dia = diasEntre(dest.inicio, hojeISO()) + 1, tot = dest.fim ? diasEntre(dest.inicio, dest.fim) + 1 : null; linha = `Dia ${dia}${tot ? ' de ' + tot : ''}`; }
    else { const n = diasEntre(hojeISO(), dest.inicio); linha = `Faltam ${n} dia${n===1?'':'s'}`; }
    const al = alertaDe(dest, r);
    cartao = `<a href="#/v/${dest.id}" class="card" style="color:inherit;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="tag ${st}">${STATUS_TXT[st]}</span><span style="font-size:13px;color:var(--muted)">${fmtPeriodo(dest)}</span></div>
      <div><div style="font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15">${esc(dest.nome)}</div><div style="font-size:14px;color:var(--muted)">${[dest.destino, linha].filter(Boolean).map(esc).join(' · ')}</div></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="big" style="font-size:28px">${brl(r.total)}</span><span style="font-size:13px;color:var(--muted)">${lim ? 'de ' + brl(lim) : 'sem limite'}</span></div>
      ${barra(r, lim)}
      <div class="legend"><span><span class="dot S"></span>Sérgio ${brl(r.pagoS)}</span><span><span class="dot V"></span>Victoria ${brl(r.pagoV)}</span></div>
    </a>${al ? `<div class="alert">${sv(IC.aviso,20)}<span>${al}</span></div>` : ''}`;
  } else {
    cartao = `<div class="card" style="gap:6px"><b style="font-size:20px">${D.viagens.length ? 'Nenhuma viagem agora' : 'A primeira viagem'}</b>
      <span style="color:var(--muted);font-size:15px">${D.viagens.length ? 'Que tal planejar a próxima?' : 'Criem uma viagem para começar. Pode ser uma que já passou, como a Argentina 2025.'}</span></div>`;
  }
  const lista = outras.map(v => {
    const r = resumo(v.id), st = status(v), lim = Number(v.limite);
    const det = [fmtPeriodo(v), st === 'plan' ? (lim ? 'limite ' + brl(lim) : '') : brl(r.total)].filter(Boolean).join(' · ');
    return `<a class="row" href="#/v/${v.id}"><span class="tx"><b>${esc(v.nome)}</b><span>${det}</span></span><span class="tag ${st}">${STATUS_TXT[st]}</span>${CHEV}</a>`;
  }).join('');
  $app.innerHTML = `
  <nav class="nav"><a href="#/nos" aria-label="Nós: configurações do casal" style="gap:0"><span class="av S">S</span><span class="av V" style="margin-left:-8px;box-shadow:0 0 0 2px #fff">V</span></a>
    <a href="#/nova-viagem" aria-label="Nova viagem">${sv(IC.plus,26,2)}</a></nav>
  <h1 class="t">Viagens</h1>
  ${cartao}
  ${outras.length ? `<div class="sh">Próximas e anteriores</div><div class="grp">${lista}</div>` : ''}
  <div class="grp"><a class="row" href="#/nova-viagem" style="color:var(--acc);font-weight:600"><span class="tile" style="background:transparent;color:var(--acc);width:auto">${sv(IC.plus,22,2)}</span><span class="tx"><b style="color:var(--acc)">Nova viagem</b></span></a></div>
  ${tabbar('viagens')}`;
}

let abaViagem = {};
function telaViagem(id, abaUrl){
  const v = viagem(id); if (!v) return naoAchou();
  store.set('vd_atual', id);
  const st = status(v);
  const aba = abaUrl || abaViagem[id] || ((st === 'ok' || st === 'end') ? 'categorias' : 'gastos');
  const r = resumo(id), lim = Number(v.limite) || 0;
  let info = [v.destino, fmtPeriodo(v)].filter(Boolean).map(esc).join(' · ');
  if (st === 'now') { const dia = diasEntre(v.inicio, hojeISO()) + 1, tot = v.fim ? diasEntre(v.inicio, v.fim) + 1 : null; info += ` · dia ${dia}${tot ? ' de ' + tot : ''}`; }
  else info += (info ? ' · ' : '') + STATUS_TXT[st].toLowerCase();
  let resta = '', pct = '';
  if (lim) {
    const passou = r.total > lim;
    resta = passou ? `Passaram ${brl(r.total - lim)} do limite` : `Restam ${brl(lim - r.total)}`;
    if (!passou && st === 'now' && v.fim) { const dl = diasEntre(hojeISO(), v.fim) + 1; if (dl > 0) resta += ` · ~${brl(Math.floor((lim - r.total)/dl))}/dia`; }
    pct = Math.round(r.total/lim*100) + '%';
  }
  let corpo = '';
  if (aba === 'gastos') {
    let html = '', ult = null, abertos = false;
    r.gs.forEach(g => {
      if (g.data !== ult) { if (abertos) html += '</div>'; ult = g.data; html += `<div class="sh">${fmtGrupo(g.data)}</div><div class="grp">`; abertos = true; }
      html += `<a class="row" href="#/gasto/${g.id}"><span class="av ${g.pagou}">${g.pagou}</span>
        <span class="tx"><b>${esc(g.descricao || catNome(g.categoria))}</b><span>${catNome(g.categoria)} · ${divTxt(g)}</span></span>
        <span class="val">${brl(g.valor)}</span>${CHEV}</a>`;
    });
    if (abertos) html += '</div>';
    corpo = html || '<div class="grp"><div class="empty">Nenhum gasto ainda. Toque em Lançar.</div></div>';
  } else {
    const maior = Math.max(...Object.values(r.cat), 0.01), lc = v.limites_cat || {};
    const linhas = CATS.filter(c => r.cat[c.id] > 0 || Number(lc[c.id]) > 0).sort((a,b) => r.cat[b.id] - r.cat[a.id]).map(c => {
      const val = r.cat[c.id], pc = r.total ? Math.round(val/r.total*100) : 0, l = Number(lc[c.id]) || 0, passou = l && val > l;
      return `<div class="row" style="flex-direction:column;align-items:stretch;gap:8px;cursor:default">
        <div style="display:flex;align-items:center;gap:12px"><span class="tile" style="background:${passou?'var(--warn)':'var(--acc)'}">${sv(IC[c.id],18,2)}</span>
          <span class="tx"><b>${c.nome}</b><span>${pc}% da viagem${l ? ' · limite ' + brl(l) : ''}</span></span><span class="val strong" style="${passou?'color:var(--warn)':''}">${brl(val)}</span></div>
        <div class="bar" style="height:6px;margin-left:42px"><span style="width:${val/maior*100}%;background:${passou?'var(--warn)':'var(--acc)'};border-radius:99px"></span></div></div>`;
    }).join('');
    corpo = `<div class="grp">${linhas || '<div class="empty">Ainda não há gastos.</div>'}</div>`;
  }
  const al = alertaDe(v, r);
  $app.innerHTML = `
  <nav class="nav"><a href="#/">${sv(IC.voltar,22,2.2)} Viagens</a><a href="#/limite/${id}">Editar</a></nav>
  <h1 class="t">${esc(v.nome)}</h1><div class="sub">${info}</div>
  <div class="card">
    <div class="hl"><span>Gasto</span><span>${lim ? 'de ' + brl(lim) : '<a href="#/limite/'+id+'">definir limite</a>'}</span></div>
    <div class="big">${brl(r.total)}</div>
    ${barra(r, lim)}
    ${lim ? `<div class="hl"><span>${resta}</span><b style="color:var(--ink)">${pct}</b></div>` : ''}
  </div>
  ${al ? `<div class="alert">${sv(IC.aviso,20)}<span>${al}</span></div>` : ''}
  <div class="duo">${['S','V'].map(p => `<div class="mini"><span class="av ${p}">${p}</span><span class="ml">${NOME[p]} pagou</span><b>${brl(p==='S'?r.pagoS:r.pagoV)}</b></div>`).join('')}</div>
  <div class="grp"><a class="row" href="#/acerto/${id}"><span class="tile">${sv(IC.troca,18,2)}</span><span class="tx"><b>Acerto de contas</b><span>${r.gs.length ? fraseSaldo(r) : 'Nada para acertar ainda'}</span></span>${CHEV}</a></div>
  <div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))" role="group" aria-label="Ver">
    <button data-aba="gastos" aria-pressed="${aba==='gastos'}">Gastos</button><button data-aba="categorias" aria-pressed="${aba==='categorias'}">Por categoria</button></div>
  ${corpo}
  ${tabbar('viagens')}`;
  $app.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { abaViagem[id] = b.dataset.aba; history.replaceState(null, '', '#/v/' + id); telaViagem(id, b.dataset.aba); });
}

/* --- novo / editar gasto --- */
let F = null;
function telaGasto(viagemId, gastoId){
  const g = gastoId ? D.gastos.find(x => x.id === gastoId) : null;
  if (gastoId && !g) return naoAchou();
  const vid = g ? g.viagem_id : viagemId;
  if (!vid) { location.hash = '#/nova-viagem'; return; }
  if (!viagem(vid)) return naoAchou();
  const k = g ? 'g:' + g.id : 'n:' + vid;
  if (!F || F.k !== k) {
    F = g ? { k, id: g.id, viagem_id: vid, valor: String(g.valor).replace('.', ','), descricao: g.descricao, categoria: g.categoria, pagou: g.pagou, divisao: g.divisao, pct: Math.round(parteS(g)*100), data: g.data }
          : { k, viagem_id: vid, valor: '', descricao: '', categoria: 'comida', pagou: eu || 'S', divisao: 'metade', pct: 50, data: hojeISO() };
  }
  const opcoes = D.viagens.map(x => `<option value="${x.id}" ${x.id===F.viagem_id?'selected':''}>${esc(x.nome)}</option>`).join('');
  $app.innerHTML = `
  <nav class="nav"><a href="#/v/${vid}">Cancelar</a><b style="font-size:17px">${g ? 'Editar gasto' : 'Novo gasto'}</b><span style="width:62px"></span></nav>
  <form id="f-gasto" style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 2px">
      <label for="in-valor" style="font-size:13px;color:var(--muted)">Valor</label>
      <input id="in-valor" class="amount" inputmode="decimal" placeholder="R$ 0" value="${esc(F.valor ? 'R$ ' + F.valor : '')}" autocomplete="off">
      <span id="ajuda" style="font-size:13px;color:var(--muted)">${ajudaDivisao()}</span>
    </div>
    <div class="grp">
      <label class="row" style="cursor:text"><span class="tx" style="flex:none"><b>Descrição</b></span><input id="in-desc" class="fin" placeholder="Ex.: jantar, Uber" value="${esc(F.descricao)}" autocomplete="off"></label>
      <label class="row"><span class="tx" style="flex:none"><b>Viagem</b></span>${g ? `<span class="fin">${esc(viagem(vid).nome)}</span>` : `<select id="sel-v" class="fin">${opcoes}</select>`}</label>
      <label class="row"><span class="tx" style="flex:none"><b>Data</b></span><input id="in-data" class="fin" type="date" value="${F.data}"></label>
    </div>
    <div class="sh">Quem pagou</div>
    <div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))" role="group" aria-label="Quem pagou">
      ${['S','V'].map(p => `<button type="button" data-pagou="${p}" aria-pressed="${F.pagou===p}">${NOME[p]}</button>`).join('')}</div>
    <div class="sh">Categoria</div>
    <div class="cats" role="group" aria-label="Categoria">${CATS.map(c => `<button type="button" data-cat="${c.id}" aria-pressed="${F.categoria===c.id}">${sv(IC[c.id],22,1.8)}${c.nome}</button>`).join('')}</div>
    <div class="sh">Divisão</div>
    <div class="seg" style="grid-template-columns:1fr 1.35fr .8fr" role="group" aria-label="Divisão">
      <button type="button" data-div="metade" aria-pressed="${F.divisao==='metade'}">Metade cada</button>
      <button type="button" data-div="pagador" aria-pressed="${F.divisao==='pagador'}">Só de quem pagou</button>
      <button type="button" data-div="outra" aria-pressed="${F.divisao==='outra'}">Outra</button></div>
    ${F.divisao === 'outra' ? `<div class="grp" style="padding:12px 16px"><label for="in-pct" style="font-size:14px">Parte do Sérgio: <b id="pct-a">${F.pct}%</b> · Victoria: <b id="pct-b">${100-F.pct}%</b></label>
      <input id="in-pct" type="range" min="0" max="100" step="5" value="${F.pct}"></div>` : ''}
    ${g ? '<div class="grp"><button class="row danger" type="button" id="bt-excluir" style="justify-content:center;font-weight:600">Excluir gasto</button></div>' : ''}
    <div style="height:96px"></div>
    <div class="bottom"><span class="hint" id="previa">${previa()}</span><button class="btn" type="submit" id="bt-salvar">${g ? 'Salvar' : 'Lançar gasto'}</button></div>
  </form>
  ${tabbar(g ? 'viagens' : 'novo')}`;
  const upd = () => { document.getElementById('ajuda').textContent = ajudaDivisao(); document.getElementById('previa').textContent = previa(); };
  const iv = document.getElementById('in-valor');
  iv.oninput = () => { F.valor = iv.value.replace(/[^\d,.]/g,''); upd(); };
  document.getElementById('in-desc').oninput = e => F.descricao = e.target.value;
  document.getElementById('in-data').onchange = e => F.data = e.target.value || hojeISO();
  const ip = document.getElementById('in-pct');
  if (ip) ip.oninput = () => { F.pct = Number(ip.value); document.getElementById('pct-a').textContent = F.pct + '%'; document.getElementById('pct-b').textContent = (100-F.pct) + '%'; upd(); };
  const sel = document.getElementById('sel-v');
  if (sel) sel.onchange = () => { F.viagem_id = sel.value; F.k = 'n:' + sel.value; store.set('vd_atual', sel.value); history.replaceState(null,'','#/novo/' + sel.value); upd(); };
  $app.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { F.categoria = b.dataset.cat; $app.querySelectorAll('[data-cat]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $app.querySelectorAll('[data-pagou]').forEach(b => b.onclick = () => { F.pagou = b.dataset.pagou; $app.querySelectorAll('[data-pagou]').forEach(x => x.setAttribute('aria-pressed', x === b)); upd(); });
  $app.querySelectorAll('[data-div]').forEach(b => b.onclick = () => { F.divisao = b.dataset.div; telaGasto(viagemId, gastoId); });
  document.getElementById('f-gasto').onsubmit = salvarGasto;
  const bx = document.getElementById('bt-excluir');
  if (bx) bx.onclick = async () => {
    if (!confirm('Excluir este gasto?')) return;
    try { await rpc('vd_excluir', { p_tipo: 'gasto', p_id: F.id }); F = null; toast('Gasto excluído'); location.hash = '#/v/' + vid; carregar(); }
    catch(e){ toast(e.message); }
  };
}
function ajudaDivisao(){
  const val = parseValor(F.valor);
  if (F.divisao === 'metade') return val ? `${brl(val/2, true)} para cada` : 'Dividido meio a meio';
  if (F.divisao === 'pagador') return `Fica todo na conta ${F.pagou==='S'?'do Sérgio':'da Victoria'}`;
  return val ? `Sérgio ${brl(val*F.pct/100, true)} · Victoria ${brl(val*(100-F.pct)/100, true)}` : 'Escolha a parte de cada um';
}
function previa(){
  const v = viagem(F.viagem_id); if (!v) return '';
  const lim = Number(v.limite) || 0, r = resumo(v.id);
  const atual = F.id ? (Number((D.gastos.find(x => x.id === F.id) || {}).valor) || 0) : 0;
  const tot = r.total - atual + parseValor(F.valor);
  return lim ? `Com este gasto: ${brl(tot)} de ${brl(lim)} (${Math.round(tot/lim*100)}%)` : `Com este gasto: ${brl(tot)} na viagem`;
}
async function salvarGasto(ev){
  ev.preventDefault();
  const valor = parseValor(F.valor);
  if (!(valor > 0)) { toast('Digite o valor do gasto'); document.getElementById('in-valor').focus(); return; }
  const v = viagem(F.viagem_id), antes = resumo(v.id).total;
  const bt = document.getElementById('bt-salvar'); bt.disabled = true; bt.textContent = 'Salvando…';
  const p = { viagem_id: F.viagem_id, valor, descricao: F.descricao.trim(), categoria: F.categoria, pagou: F.pagou, divisao: F.divisao,
              parte_s: F.divisao === 'outra' ? F.pct/100 : (F.divisao === 'metade' ? 0.5 : (F.pagou === 'S' ? 1 : 0)), data: F.data };
  if (F.id) p.id = F.id;
  try {
    await rpc('vd_salvar_gasto', { p });
    const ed = !!F.id; F = null;
    await carregar(true);
    const depois = resumo(v.id).total, lim = Number(v.limite) || 0;
    let msg = ed ? 'Gasto atualizado' : 'Gasto lançado';
    if (v.alerta_ligado && lim) {
      const pa = antes/lim*100, pd = depois/lim*100;
      if (pd >= 100 && pa < 100) msg = `Atenção: vocês passaram do limite de ${v.nome}`;
      else if (pd >= v.alerta_pct && pa < v.alerta_pct) msg = `Atenção: chegaram a ${Math.floor(pd)}% do limite de ${v.nome}`;
    }
    location.hash = '#/v/' + v.id; toast(msg, 3600);
  } catch(e) { bt.disabled = false; bt.textContent = 'Tentar de novo'; toast(e.message); }
}

/* --- acerto --- */
function telaAcerto(id){
  const v = viagem(id); if (!v) return naoAchou();
  store.set('vd_atual', id);
  const r = resumo(id), zerado = Math.abs(r.saldoS) < 0.01;
  const deve = r.saldoS > 0 ? 'V' : 'S', recebe = deve === 'V' ? 'S' : 'V', val = Math.abs(r.saldoS);
  const difS = r2(r.pagoS - r.parteS), difV = r2(r.pagoV - r.parteV);
  const hist = r.acs.map(a => `<div class="row" style="cursor:default"><span class="av ${a.de}">${a.de}</span><span class="tx"><b>${NOME[a.de]} pagou ${brl(a.valor)}</b><span>${fmtDia(a.em.slice(0,10))}</span></span>
      <button class="btn-plain" data-desfaz="${a.id}" style="width:auto;height:36px;font-size:15px">Desfazer</button></div>`).join('');
  $app.innerHTML = `
  <nav class="nav"><a href="#/v/${id}">${sv(IC.voltar,22,2.2)} ${esc(v.nome)}</a><span></span></nav>
  <h1 class="t">Acerto de contas</h1><div class="sub">Para ficar como combinaram até agora</div>
  <div class="card" style="align-items:center;gap:14px;padding:22px 16px">
    ${zerado ? `<b style="font-size:24px">Tudo certo</b><span style="color:var(--muted);font-size:15px">Ninguém deve nada nesta viagem.</span>` : `
    <div style="display:flex;align-items:center;gap:14px"><span class="av lg ${deve}">${deve}</span>
      <svg width="40" height="16" viewBox="0 0 40 16" fill="none" stroke="#8E8E93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h34M30 2l6 6-6 6"/></svg>
      <span class="av lg ${recebe}">${recebe}</span></div>
    <span style="font-size:15px;color:var(--muted)">${NOME[deve]} deve ${recebe==='S'?'ao':'à'} ${NOME[recebe]}</span>
    <span class="big" style="font-size:44px">${brl(val, true)}</span>`}
  </div>
  <div class="grp">
    <div class="row" style="cursor:default"><span class="tx"><b>Total da viagem</b></span><span class="val">${brl(r.total)}</span></div>
    <div class="row" style="cursor:default"><span class="tx"><b>Parte de cada um</b><span>Sérgio ${brl(r.parteS)} · Victoria ${brl(r.parteV)}</span></span></div>
    <div class="row" style="cursor:default"><span class="av S">S</span><span class="tx"><b>Sérgio pagou</b><span>${brl(r.pagoS)}</span></span><span class="val" style="color:${difS>=0?'var(--ok)':'var(--danger)'}">${difS>=0?'+':'−'} ${brl(Math.abs(difS))}</span></div>
    <div class="row" style="cursor:default"><span class="av V">V</span><span class="tx"><b>Victoria pagou</b><span>${brl(r.pagoV)}</span></span><span class="val" style="color:${difV>=0?'var(--ok)':'var(--danger)'}">${difV>=0?'+':'−'} ${brl(Math.abs(difV))}</span></div>
  </div>
  ${zerado ? '' : `<button class="btn" id="bt-acertar">Marcar como acertado</button><button class="btn-plain" id="bt-copiar" style="margin-top:-8px">Copiar valor para o Pix</button>`}
  ${hist ? `<div class="sh">Acertos desta viagem</div><div class="grp">${hist}</div>` : ''}
  ${tabbar('acerto')}`;
  const bc = document.getElementById('bt-copiar');
  if (bc) bc.onclick = async () => { const t = val.toFixed(2).replace('.', ','); try { await navigator.clipboard.writeText(t); toast('Valor copiado: ' + t); } catch(e){ toast(t); } };
  const ba = document.getElementById('bt-acertar');
  if (ba) ba.onclick = async () => {
    if (!confirm(`Confirmar que ${NOME[deve]} pagou ${brl(val, true)} ${recebe==='S'?'ao':'à'} ${NOME[recebe]}?`)) return;
    ba.disabled = true;
    try { await rpc('vd_acertar', { p_viagem: id, p_de: deve, p_valor: r2(val) }); await carregar(); toast('Contas acertadas'); }
    catch(e){ ba.disabled = false; toast(e.message); }
  };
  $app.querySelectorAll('[data-desfaz]').forEach(b => b.onclick = async () => {
    if (!confirm('Desfazer este acerto?')) return;
    try { await rpc('vd_excluir', { p_tipo: 'acerto', p_id: b.dataset.desfaz }); await carregar(); toast('Acerto desfeito'); } catch(e){ toast(e.message); }
  });
}

/* --- limite e alertas --- */
function telaLimite(id){
  const v = viagem(id); if (!v) return naoAchou();
  store.set('vd_atual', id);
  const r = resumo(id), lc = v.limites_cat || {};
  const cats = CATS.map(c => {
    const val = r.cat[c.id] || 0, l = Number(lc[c.id]) || 0, pc = l ? Math.min(100, val/l*100) : 0, quente = l && val/l*100 >= v.alerta_pct;
    return `<button class="row" data-lim="${c.id}" style="flex-direction:column;align-items:stretch;gap:8px">
      <span style="display:flex;align-items:center;gap:12px"><span class="tx"><b>${c.nome}</b></span><span class="val" style="${quente?'color:var(--warn);font-weight:600':''}">${brl(val)} / ${l ? brl(l) : 'sem limite'}</span>${CHEV}</span>
      ${l ? `<span class="bar" style="height:6px"><span style="width:${pc}%;background:${quente?'var(--warn)':'var(--acc)'};border-radius:99px"></span></span>` : ''}</button>`;
  }).join('');
  $app.innerHTML = `
  <nav class="nav"><a href="#/v/${id}">${sv(IC.voltar,22,2.2)} ${esc(v.nome)}</a><span></span></nav>
  <h1 class="t">Limite e alertas</h1>
  <div class="grp"><button class="row" id="bt-lim"><span class="tx"><b>Limite total</b></span><span class="val strong">${Number(v.limite) ? brl(v.limite) : 'Definir'}</span>${CHEV}</button></div>
  <div class="sh">Por categoria</div><div class="grp">${cats}</div>
  <div class="foot">Toque numa categoria para definir o limite dela.</div>
  <div class="sh">Alertas</div>
  <div class="grp">
    <div class="row" style="cursor:default"><span class="tx"><b>Avisar ao chegar em ${v.alerta_pct}%</b><span>Do total e de cada categoria</span></span><button class="sw" id="sw-alerta" aria-pressed="${v.alerta_ligado}" aria-label="Avisar ao chegar em ${v.alerta_pct}%"></button></div>
    <div class="row" style="cursor:default"><span class="tx"><b>Quando avisar</b></span>
      <div class="seg" style="grid-template-columns:repeat(3,52px)" role="group" aria-label="Quando avisar">${[70,80,90].map(n => `<button data-pct="${n}" aria-pressed="${v.alerta_pct===n}">${n}%</button>`).join('')}</div></div>
    <div class="row" style="cursor:default"><span class="tx"><b>Avisar os dois</b><span>Sérgio e Victoria veem o aviso</span></span><button class="sw" id="sw-ambos" aria-pressed="${v.alerta_ambos}" aria-label="Avisar os dois"></button></div>
  </div>
  <div class="sh">Dados da viagem</div>
  ${formViagem(v)}
  ${tabbar('limite')}`;
  document.getElementById('bt-lim').onclick = async () => { const n = await pedirValor('Limite da viagem', v.limite); if (n == null) return; salvarViagem({ id, limite: n }, 'Limite salvo'); };
  $app.querySelectorAll('[data-lim]').forEach(b => b.onclick = async () => {
    const c = b.dataset.lim, n = await pedirValor('Limite de ' + catNome(c), lc[c] || 0, true); if (n == null) return;
    const novo = Object.assign({}, lc); if (n > 0) novo[c] = n; else delete novo[c];
    salvarViagem({ id, limites_cat: novo }, 'Limite salvo');
  });
  document.getElementById('sw-alerta').onclick = () => salvarViagem({ id, alerta_ligado: !v.alerta_ligado });
  document.getElementById('sw-ambos').onclick = () => salvarViagem({ id, alerta_ambos: !v.alerta_ambos });
  $app.querySelectorAll('[data-pct]').forEach(b => b.onclick = () => salvarViagem({ id, alerta_pct: Number(b.dataset.pct) }));
  ligarFormViagem(v);
}
async function salvarViagem(p, msg){
  try { const nid = await rpc('vd_salvar_viagem', { p }); await carregar(); if (msg) toast(msg); return nid; }
  catch(e){ toast(e.message); return null; }
}
function formViagem(v){
  v = v || {};
  return `<form id="f-viagem" style="display:flex;flex-direction:column;gap:14px">
    <div class="grp">
      <label class="row" style="cursor:text"><span class="tx" style="flex:none"><b>Nome</b></span><input class="fin" id="fv-nome" required placeholder="Ex.: Argentina 2025" value="${esc(v.nome)}"></label>
      <label class="row" style="cursor:text"><span class="tx" style="flex:none"><b>Destino</b></span><input class="fin" id="fv-dest" placeholder="Ex.: Buenos Aires" value="${esc(v.destino)}"></label>
      <label class="row"><span class="tx" style="flex:none"><b>Ida</b></span><input class="fin" id="fv-ini" type="date" value="${v.inicio||''}"></label>
      <label class="row"><span class="tx" style="flex:none"><b>Volta</b></span><input class="fin" id="fv-fim" type="date" value="${v.fim||''}"></label>
      ${v.id ? '' : `<label class="row" style="cursor:text"><span class="tx" style="flex:none"><b>Limite</b></span><input class="fin" id="fv-lim" inputmode="decimal" placeholder="Opcional"></label>`}
    </div>
    <button class="btn" type="submit">${v.id ? 'Salvar dados' : 'Criar viagem'}</button>
    ${v.id ? '<div class="grp"><button class="row danger" type="button" id="fv-excluir" style="justify-content:center;font-weight:600">Excluir viagem</button></div>' : ''}
  </form>`;
}
function ligarFormViagem(v){
  const f = document.getElementById('f-viagem'); if (!f) return;
  f.onsubmit = async ev => {
    ev.preventDefault();
    const p = { nome: document.getElementById('fv-nome').value.trim(), destino: document.getElementById('fv-dest').value.trim(),
                inicio: document.getElementById('fv-ini').value, fim: document.getElementById('fv-fim').value };
    if (!p.nome) return;
    if (p.inicio && p.fim && p.fim < p.inicio) { toast('A volta está antes da ida'); return; }
    if (v && v.id) { p.id = v.id; salvarViagem(p, 'Viagem salva'); return; }
    p.limite = parseValor((document.getElementById('fv-lim')||{}).value);
    const nid = await salvarViagem(p, 'Viagem criada');
    if (nid) { store.set('vd_atual', nid); location.hash = '#/v/' + nid; }
  };
  const bx = document.getElementById('fv-excluir');
  if (bx) bx.onclick = async () => {
    if (!confirm(`Excluir a viagem ${v.nome} e todos os gastos dela?`)) return;
    try { await rpc('vd_excluir', { p_tipo: 'viagem', p_id: v.id }); store.set('vd_atual', null); location.hash = '#/'; await carregar(); toast('Viagem excluída'); }
    catch(e){ toast(e.message); }
  };
}
function telaNovaViagem(){
  $app.innerHTML = `
  <nav class="nav"><a href="#/">Cancelar</a><b style="font-size:17px">Nova viagem</b><span style="width:62px"></span></nav>
  <div class="foot" style="margin:0 16px">Pode ser uma que vem por aí ou uma que já aconteceu.</div>
  ${formViagem(null)}
  ${tabbar('viagens')}`;
  ligarFormViagem(null);
}

/* --- nós --- */
function telaNos(){
  const link = location.origin + location.pathname + '#k=' + chave;
  $app.innerHTML = `
  <nav class="nav"><a href="#/">${sv(IC.voltar,22,2.2)} Viagens</a><span></span></nav>
  <h1 class="t">Nós</h1>
  <div class="sh">Quem usa este celular</div>
  <div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))" role="group" aria-label="Quem usa este celular">
    ${['S','V'].map(p => `<button data-eu="${p}" aria-pressed="${eu===p}">${NOME[p]}</button>`).join('')}</div>
  <div class="foot">Quem pagou já vem marcado com o seu nome ao lançar um gasto.</div>
  <div class="sh">Usar no outro celular</div>
  <div class="grp"><button class="row" id="bt-link"><span class="tile">${sv(IC.troca,18,2)}</span><span class="tx"><b>Compartilhar link do casal</b><span>Mande só entre vocês dois</span></span>${CHEV}</button></div>
  <div class="sh">Tela de início</div>
  <div class="grp"><div class="row" style="cursor:default"><span class="tx"><span style="font-size:14px;color:var(--muted2)">iPhone: no Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”. Android: no Chrome, menu ⋮ e “Adicionar à tela inicial”. Se pedir o código depois, cole o link do casal.</span></span></div></div>
  <div class="grp"><button class="row danger" id="bt-sair" style="justify-content:center;font-weight:600">Sair deste celular</button></div>
  ${tabbar('')}`;
  $app.querySelectorAll('[data-eu]').forEach(b => b.onclick = () => { eu = b.dataset.eu; store.set('vd_eu', eu); telaNos(); toast('Pronto, ' + NOME[eu]); });
  document.getElementById('bt-link').onclick = async () => {
    try { if (navigator.share) { await navigator.share({ title: 'Viagens a Dois', text: 'Nosso app de gastos de viagem', url: link }); return; } } catch(e){ if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(link); toast('Link copiado'); } catch(e){ prompt('Copie o link:', link); }
  };
  document.getElementById('bt-sair').onclick = () => { if (!confirm('Sair deste celular? Vai precisar do código do casal para entrar de novo.')) return; store.set('vd_chave', null); chave = null; render(); };
}

/* --- folha para digitar valor --- */
function pedirValor(titulo, atual, permiteZero){
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'veil';
    w.innerHTML = `<form class="sheet" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><span class="grab"></span><h3>${esc(titulo)}</h3>
      <input class="amount" id="pv" inputmode="decimal" style="font-size:40px" value="${Number(atual) ? 'R$ ' + String(atual).replace('.', ',') : ''}" placeholder="R$ 0">
      ${permiteZero ? '<span class="hint">Deixe vazio para tirar o limite.</span>' : ''}
      <button class="btn" type="submit">Salvar</button><button class="btn-plain" type="button" id="pv-c">Cancelar</button></form>`;
    document.body.appendChild(w);
    const i = w.querySelector('#pv'); setTimeout(() => i.focus(), 50);
    const fim = val => { w.remove(); res(val); };
    w.onclick = e => { if (e.target === w) fim(null); };
    w.querySelector('#pv-c').onclick = () => fim(null);
    w.querySelector('form').onsubmit = e => { e.preventDefault(); fim(parseValor(i.value)); };
  });
}
function naoAchou(){
  $app.innerHTML = `<div style="height:40px"></div><h1 class="t">Não encontrada</h1><div class="sub" style="margin-top:-6px">Essa viagem ou gasto não existe mais.</div>
  <a class="btn" href="#/">Voltar às viagens</a>${tabbar('viagens')}`;
}

/* ---------- rotas ---------- */
function render(){
  if (!chave) return telaEntrar();
  if (!carregado) { $app.innerHTML = '<div class="spin" role="status" aria-label="Carregando"></div>'; return; }
  const p = (location.hash.replace(/^#\/?/, '') || '').split('/');
  window.scrollTo(0, 0);
  switch (p[0]) {
    case 'v': return telaViagem(p[1], p[2]);
    case 'novo': return telaGasto(p[1] || idAtual(), null);
    case 'gasto': return telaGasto(null, p[1]);
    case 'acerto': return telaAcerto(p[1] || idAtual());
    case 'limite': return telaLimite(p[1] || idAtual());
    case 'nova-viagem': return telaNovaViagem();
    case 'nos': return telaNos();
    default: F = null; return telaViagens();
  }
}
function emFormulario(){ return /^#\/(novo|gasto|nova-viagem|limite)/.test(location.hash) || document.querySelector('.veil') || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)); }

/* ---------- atualização automática ---------- */
const VERSAO = '2026-10-26-3';
async function checarVersao(){
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const { versao } = await r.json();
    if (versao && versao !== VERSAO && !emFormulario()) {
      const h = location.hash.startsWith('#/') ? location.hash : '#/';
      location.replace(location.pathname + '?v=' + encodeURIComponent(versao) + h);
    }
  } catch(e){}
}

(function iniciar(){
  checarVersao();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checarVersao(); });
  const m = location.hash.match(/k=([A-Za-z0-9]+)/);
  if (m) { chave = m[1]; store.set('vd_chave', chave); history.replaceState(null, '', location.pathname + location.search + '#/'); }
  window.addEventListener('hashchange', () => { if (!/^#\/(novo|gasto)/.test(location.hash)) F = null; render(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && chave && !emFormulario()) carregar(true); });
  setInterval(() => { if (chave && document.visibilityState === 'visible' && !emFormulario()) carregar(true); }, 20000);
  if (chave) carregar(); else render();
})();
</script>
