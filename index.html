<style>
:root{
  --bg:#FFFFFF; --fill:#F2F2F7; --fill2:#E5E5EA; --ink:#141414; --muted:#8E8E93; --muted2:#3C3C43; --sep:#D1D1D6;
  --acc:#2453A6; --acc-soft:#EAF0FB;
  --s:#1B2430; --v:#6E9BE8; --v-ink:#10233F;
  --ok:#1F7A42; --warn:#B4540A; --warn-soft:#FDF1E4; --danger:#C4372B;

  --tab:84px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.4;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--acc);text-decoration:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(var(--tab) + env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.nav{display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:17px}
.nav a,.nav button{color:var(--acc);background:none;border:0;padding:10px 0;cursor:pointer;display:flex;align-items:center;gap:2px;font-size:17px}
h1.t{margin:0;font-weight:800;font-size:34px;letter-spacing:-.035em;line-height:1.1}
.sub{font-size:15px;color:var(--muted);margin-top:-10px}
.card{background:var(--fill);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.hl{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.big{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.bar{height:8px;border-radius:99px;background:var(--fill2);display:flex;overflow:hidden;position:relative}
.bar>span{display:block;height:100%}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{background:var(--fill);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.mini .ml{font-size:13px;color:var(--muted)} .mini b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;color:#fff}
.av.S{background:var(--s)} .av.V{background:var(--v);color:var(--v-ink)}
.av.lg{width:52px;height:52px;font-size:19px}
.grp{background:var(--fill);border-radius:14px;padding-left:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px 10px 0;border-bottom:.5px solid var(--sep);color:inherit;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row .tx{flex:1;display:flex;flex-direction:column;min-width:0}
.row .tx b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{font-size:13px;color:var(--muted)}
.row .val{font-size:16px;color:var(--muted2);white-space:nowrap}
.row .val.strong{color:var(--ink);font-weight:600}
.chev{flex:none;color:#C4C4C7}
.tile{width:30px;height:30px;border-radius:8px;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.sh{font-size:13px;color:var(--muted);text-transform:uppercase;margin:8px 0 -8px 16px;letter-spacing:.01em}
.foot{font-size:13px;color:var(--muted);margin:-6px 16px 0}
.seg{display:grid;background:#EEEEF0;border-radius:9px;padding:2px}
.seg button{height:32px;border:0;background:transparent;font-size:13px;font-weight:600;border-radius:7px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.now{background:var(--acc-soft);color:var(--acc)} .tag.plan{background:var(--fill2);color:var(--muted2)}
.tag.ok{color:var(--ok);background:#E3F1E8} .tag.end{color:var(--muted2);background:var(--fill2)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.S{background:var(--s)} .dot.V{background:var(--v)}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px}
.btn{height:52px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:17px;font-weight:700;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}

.danger{color:var(--danger)!important}
.amount{border:0;background:transparent;text-align:center;width:100%;font-size:52px;font-weight:800;letter-spacing:-.04em;padding:0;outline:none;color:var(--ink)}

.fin{flex:1;border:0;background:transparent;font-size:16px;text-align:right;outline:none;min-width:0;color:var(--muted2);padding:0}
.fin::placeholder{color:#C7C7CC}
.fin.left{text-align:left;color:var(--ink)}
select.fin{-webkit-appearance:none;appearance:none;cursor:pointer;text-align:right;text-align-last:right}
input[type=date].fin{-webkit-appearance:none;appearance:none;min-height:24px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cats button{height:68px;border:0;border-radius:14px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;padding:0 2px;font-weight:600;cursor:pointer;color:var(--ink)}
.cats button[aria-pressed="true"]{background:var(--acc);color:#fff}
.sw{width:51px;height:31px;border:0;border-radius:999px;background:var(--fill2);position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .15s}
.sw[aria-pressed="true"]{background:var(--acc)}
.sw[aria-pressed="true"]::after{left:22px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);background:rgba(249,249,249,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:.5px solid var(--sep);padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));z-index:10}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--muted);min-height:48px;justify-content:center}
.tabbar a.on{color:var(--acc)}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) - 6px);width:min(480px,100%);padding:12px 16px 10px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 35%);display:flex;flex-direction:column;gap:6px;z-index:5}
.hint{font-size:13px;color:var(--muted);text-align:center}
.empty{padding:20px 16px;color:var(--muted);text-align:center;font-size:15px}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(16px);bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 80px);background:rgba(20,20,20,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:min(480px,100%);border-radius:14px 14px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:20px;font-weight:800;text-align:center}
.grab{width:36px;height:5px;border-radius:999px;background:#D1D1D6;align-self:center}
.spin{width:28px;height:28px;border:3px solid var(--fill2);border-top-color:var(--acc);border-radius:50%;animation:r 1s linear infinite;margin:38vh auto 0}
@keyframes r{to{transform:rotate(360deg)}}
input[type=range]{width:100%;accent-color:var(--acc)}

.ring{position:relative;width:240px;height:240px;align-self:center;margin-top:4px}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.ring-l{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ring-v{max-width:170px;white-space:nowrap;font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.ring-s{font-size:13px;color:var(--muted)}
.legend b{font-weight:700;color:var(--ink)}
#app.folha{padding:0;gap:0;background:#8E8E93;min-height:100vh;min-height:100dvh}
.fundo{display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 18px;color:#fff;opacity:.75;min-height:96px}
.fundo-t{font-size:28px;font-weight:800;letter-spacing:-.03em}.fundo-s{font-size:13px}
.sheet2{flex:1;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:12px}
.sheet2 .grab{margin-bottom:-2px}
.sh2{display:flex;justify-content:space-between;align-items:center}
.eyb{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.data input{border:0;background:var(--fill);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;color:var(--ink);-webkit-appearance:none;appearance:none;min-height:32px}
.valor{text-align:center;font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.valor.zero{color:#C7C7CC}
.desc{border:0;background:transparent;text-align:center;font-size:16px;font-weight:500;padding:6px 0;outline:none;width:100%}
.desc::placeholder{color:var(--muted)}
.desc:focus{box-shadow:0 1.5px 0 var(--acc)}
.viag{display:flex;justify-content:center;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:-6px}
.viag select{border:0;background:transparent;font-weight:700;color:var(--acc);font-size:13px;-webkit-appearance:none;appearance:none;cursor:pointer}
.quem{display:flex;justify-content:center;gap:8px}
.quem button{height:40px;padding:0 14px 0 6px;border-radius:999px;border:1px solid var(--sep);background:#fff;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;cursor:pointer}
.quem button.S[aria-pressed="true"]{background:var(--s);border-color:var(--s);color:#fff}
.quem button.V[aria-pressed="true"]{background:var(--v);border-color:var(--v);color:var(--v-ink)}
.quem button[aria-pressed="true"] .av{background:#fff;color:var(--ink)}
.catrow{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.catrow::-webkit-scrollbar{display:none}
.catrow button{flex:none;min-width:74px;height:60px;border:0;border-radius:14px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;cursor:pointer;padding:0 8px}
.catrow button[aria-pressed="true"]{background:var(--acc);color:#fff}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.keys button{height:52px;border:0;background:transparent;border-radius:12px;font-size:26px;font-weight:500;cursor:pointer;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.keys button:active{background:var(--fill)}
.btn-sec{height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--sep);background:#fff;font-size:16px;font-weight:700;cursor:pointer}

.pills2{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.pills2 .pl{position:relative;height:38px;padding:0 14px;border-radius:999px;border:0;background:var(--fill);display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);overflow:hidden}
.pills2 .pl.on{background:var(--acc-soft);color:var(--acc)}
.pills2 .pl input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.opgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opgrid button{height:78px;border:0;border-radius:14px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.opgrid button[aria-pressed="true"]{background:var(--acc);color:#fff}
.oplist{display:flex;flex-direction:column;background:var(--fill);border-radius:14px;overflow:hidden}
.oplist button{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 16px;border:0;border-bottom:.5px solid var(--sep);background:transparent;font-size:17px;font-weight:600;cursor:pointer;text-align:left;color:var(--ink)}
.oplist button:last-child{border-bottom:0}
.oplist button[aria-pressed="true"]{color:var(--acc)}
.oplist button[aria-pressed="true"]::after{content:"✓";margin-left:auto;font-weight:800}

.tl{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:58px}
.tl::before{content:"";position:absolute;left:46px;top:8px;bottom:8px;width:2px;background:var(--fill2);border-radius:2px}
.tl-no{position:relative}
.tl-dt{position:absolute;left:-58px;top:12px;width:38px;text-align:right;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;line-height:1.1}
.tl-dt small{display:block;font-size:10px;font-weight:700}
.tl-no::before{content:"";position:absolute;left:-16px;top:14px;width:10px;height:10px;border-radius:50%;background:#C7C7CC;box-shadow:0 0 0 3px var(--bg)}
.tl-no.atual::before{background:var(--acc);width:12px;height:12px;left:-17px;top:13px}
.tl-no.atual .tl-dt{color:var(--acc)}
.tl-card{display:flex;flex-direction:column;gap:3px;background:var(--fill);border-radius:14px;padding:12px 14px;color:var(--ink)}
.tl-card b{font-size:16px;font-weight:700}
.tl-card.grande{background:transparent;border-radius:0;padding:2px 0 2px 12px;border-left:2px solid var(--acc);gap:1px}
.tl-no.passada .tl-card{opacity:.7}
.tl-tag{font-size:11px;font-weight:600;color:var(--acc)}
.tl-nome{font-size:20px!important;font-weight:600!important;letter-spacing:-.02em}
.tl-meta{font-size:12.5px;color:var(--muted)}
.tl-num{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-top:3px}
.tl-num small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.stack{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;background:var(--fill2);margin-top:6px}
.stack i{display:block}
.blocos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bloco{background:var(--fill);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:98px}
.bloco b{font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.b-l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.b-s{font-size:12px;color:var(--muted)}
.bloco.escuro{background:var(--acc);color:#fff}.bloco.escuro .b-l,.bloco.escuro .b-s{color:rgba(255,255,255,.8)}
.hb{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;font-size:13px;padding:7px 0}
.hb div{height:10px;background:var(--fill2);border-radius:99px;overflow:hidden}.hb i{display:block;height:100%;border-radius:99px}
.hb b{text-align:right;font-weight:700;min-width:64px}

.lg{display:flex;flex-direction:column}
.lg-it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:.5px solid var(--sep);font-size:15px}
.lg-it:last-child{border-bottom:0}
.lg-n{flex:1}.lg-p{color:var(--muted);font-size:13px}.lg-it b{font-weight:700;min-width:82px;text-align:right}
.lg-it .dot{width:10px;height:10px}
.cal-sheet{gap:10px}
.cal-top{display:flex;justify-content:space-between;align-items:center}.cal-top b{font-size:17px}
.cal-nav{width:44px;height:44px;border:0;background:var(--fill);border-radius:50%;display:grid;place-items:center;color:var(--acc);cursor:pointer}
.cal-sem,.cal-grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-sem span{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-grade{row-gap:4px}
.dia{height:44px;border:0;background:transparent;padding:0;cursor:pointer;position:relative;display:grid;place-items:center;font-size:16px;font-weight:600;color:var(--ink)}
.dia span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1}
.dia.hoje span{box-shadow:inset 0 0 0 1.5px var(--acc)}
.dia.meio{background:var(--acc-soft);color:var(--acc)}
.dia.ini span,.dia.fim span{background:var(--acc);color:#fff;box-shadow:none}
.dia.ini.liga{background:linear-gradient(90deg,transparent 50%,var(--acc-soft) 50%)}
.dia.fim:not(.ini){background:linear-gradient(90deg,var(--acc-soft) 50%,transparent 50%)}
.cal-res{display:flex;justify-content:space-between;align-items:center;background:var(--fill);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted2)}
.cal-res b{color:var(--acc);font-size:16px}

.cat-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.cat-ic.nova{background:var(--fill2);color:var(--acc)}
.cat-ic.grande{width:64px;height:64px;border-radius:18px}
.opgrid button[aria-pressed="true"] .cat-ic{box-shadow:0 0 0 2px #fff}
.inp-cat{height:50px;border:0;border-radius:12px;background:var(--fill);padding:0 14px;font-size:17px;font-weight:600;text-align:center;outline:none}
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;justify-items:center}
.swatches button{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.icones{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.icones button{height:46px;border:0;border-radius:12px;background:var(--fill);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icones button[aria-pressed="true"]{background:var(--acc);color:#fff}
.veil .sheet{max-height:92vh;overflow-y:auto}

function brl(n, cents){
  n = r2(n);
  const temCent = cents || Math.round(Math.abs(n)*100) % 100 !== 0;
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: temCent ? 2 : 0, maximumFractionDigits: 2 });
}
function parseValor(s){
  s = String(s||'').replace(/[^\d,.-]/g,'');
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s); return isFinite(n) ? r2(n) : 0;
}
function hojeISO(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function dataObj(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function diasEntre(a,b){ return Math.round((dataObj(b) - dataObj(a)) / 86400000); }
function fmtDia(iso){ const d = dataObj(iso); return d.getDate() + ' ' + MESES[d.getMonth()]; }
function fmtPeriodo(v){
  if (!v.inicio) return '';
  const a = dataObj(v.inicio), b = v.fim ? dataObj(v.fim) : null, ano = new Date().getFullYear();
  const y = (b || a).getFullYear() !== ano ? ' ' + (b || a).getFullYear() : '';
  if (!b) return a.getDate() + ' ' + MESES[a.getMonth()] + y;
  if (a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()) return a.getDate() + ' – ' + b.getDate() + ' ' + MESES[b.getMonth()] + y;
  return a.getDate() + ' ' + MESES[a.getMonth()] + ' – ' + b.getDate() + ' ' + MESES[b.getMonth()] + y;
}
function fmtGrupo(iso){
  const dd = diasEntre(iso, hojeISO());
  if (dd === 0) return 'Hoje';
  if (dd === 1) return 'Ontem';
  const d = dataObj(iso);
  return d.getDate() + ' ' + MESES[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function toast(msg, ms){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms || 2600);
}

async function rpc(fn, args){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ p_chave: chave }, args || {}))
  });
  const txt = await r.text();
  let body = null; try { body = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!r.ok) { const e = new Error((body && body.message) || 'Erro ao falar com o servidor'); e.status = r.status; e.code = body && body.code; throw e; }
  return body;
}
async function carregar(silencioso){
  try {
    const novo = await rpc('vd_dados');
    const mudou = JSON.stringify(novo) !== JSON.stringify(D);
    D = novo; carregado = true; aplicarCategorias(D.categorias);
    if (mudou || !silencioso) render();
  } catch(e) {
    if (e.code === '28000') { chave = null; store.set('vd_chave', null); render(); return; }
    if (!silencioso) { carregado = true; render(); toast('Sem conexão. Tentando de novo…'); }
  }
}
function viagem(id){ return D.viagens.find(v => v.id === id); }
function gastosDe(id){ return D.gastos.filter(g => g.viagem_id === id); }
function parteS(g){ return g.divisao === 'metade' ? 0.5 : g.divisao === 'pagador' ? (g.pagou === 'S' ? 1 : 0) : Number(g.parte_s); }
function resumo(id){
  const gs = gastosDe(id);
  let total = 0, pagoS = 0, pagoV = 0, devidoS = 0;
  const cat = {}; CATS.forEach(c => cat[c.id] = 0);
  gs.forEach(g => {
    const v = Number(g.valor); total += v;
    if (g.pagou === 'S') pagoS += v; else pagoV += v;
    devidoS += v * parteS(g);
    cat[g.categoria] = (cat[g.categoria] || 0) + v;
  });
  const acs = D.acertos.filter(a => a.viagem_id === id);
  let saldoS = pagoS - devidoS;
  acs.forEach(a => { saldoS += a.de === 'V' ? -Number(a.valor) : Number(a.valor); });
  return { gs, total: r2(total), pagoS: r2(pagoS), pagoV: r2(pagoV), parteS: r2(devidoS), parteV: r2(total - devidoS), saldoS: r2(saldoS), cat, acs };
}
function status(v){
  const h = hojeISO();
  if (v.inicio && v.inicio > h) return 'plan';
  if (v.inicio && (!v.fim || v.fim >= h)) return 'now';
  const r = resumo(v.id);
  return (r.gs.length && Math.abs(r.saldoS) < 0.01) ? 'ok' : 'end';
}
const STATUS_TXT = { now:'Em andamento', plan:'Planejada', ok:'Acertada', end:'Encerrada' };
const ehProxima = v => { const st = status(v); return st === 'now' || st === 'plan'; };
const porData = (a,b) => (a.inicio || '9999') < (b.inicio || '9999') ? -1 : 1;
function proximas(){ return D.viagens.filter(ehProxima).sort((a,b) => (status(a)==='now') !== (status(b)==='now') ? (status(a)==='now' ? -1 : 1) : porData(a,b)); }
function anteriores(){ return D.viagens.filter(v => !ehProxima(v)).sort((a,b) => porData(b,a)); }
/* a viagem em destaque é sempre a mais próxima: a que está acontecendo, senão a próxima a começar, senão a última que passou */
function destaque(){ return proximas()[0] || anteriores()[0] || null; }
function idAtual(){
  const salvo = store.get('vd_atual'); if (salvo && viagem(salvo)) return salvo;
  const d = destaque(); if (d) return d.id;
  return D.viagens[0] ? D.viagens[0].id : null;
}
function alertaDe(v, r){
  return null;
  if (!v.alerta_ligado || !(Number(v.limite) > 0)) return null;
  const pct = r.total / Number(v.limite) * 100;
  if (pct >= 100) return `Vocês passaram do limite: ${brl(r.total)} de ${brl(v.limite)}.`;
  if (pct >= v.alerta_pct) return `Atenção: já usaram ${Math.floor(pct)}% do limite. Restam ${brl(Number(v.limite) - r.total)}.`;
  return null;
}
function fraseSaldo(r){
  if (Math.abs(r.saldoS) < 0.01) return 'Tudo acertado entre vocês';
  return r.saldoS > 0 ? `Victoria deve ${brl(r.saldoS)} ao Sérgio` : `Sérgio deve ${brl(-r.saldoS)} à Victoria`;
}
function barra(r, lim){
  const base = Math.max(Number(lim)||0, r.total) || 1;
  return `<div class="bar"><span style="width:${r.pagoS/base*100}%;background:var(--s)"></span><span style="width:${r.pagoV/base*100}%;background:var(--v)"></span></div>`;
}
const divTxt = g => g.divisao === 'metade' ? 'metade cada' : g.divisao === 'pagador' ? (g.pagou === 'S' ? 'só dele' : 'só dela') : `${Math.round(parteS(g)*100)}/${100-Math.round(parteS(g)*100)}`;

let abaViagem = {};
function anel(r, lim){
  const R = 96, C = 2 * Math.PI * R, base = Math.max(Number(lim)||0, r.total) || 1;
  const fatias = CATS.map(c => ({ c, v: r.cat[c.id] || 0 })).filter(x => x.v > 0).sort((a,b) => b.v - a.v);
  const gap = fatias.length > 1 ? 5 : 0;
  let off = 0, arcos = '';
  fatias.forEach(x => {
    const len = x.v / base * C;
    if (len > 1) arcos += `<circle cx="120" cy="120" r="${R}" stroke="${CAT_COR[x.c.id]}" stroke-dasharray="${Math.max(len - gap, 0.5)} ${C}" stroke-dashoffset="${-off}"/>`;
    off += len;
  });
  const desc = fatias.map(x => `${x.c.nome} ${brl(x.v)}`).join(', ');
  return `<svg width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Gastos por categoria: ${desc || 'nenhum'}">
    <g transform="rotate(-90 120 120)" fill="none" stroke-width="16" stroke-linecap="butt">
      <circle cx="120" cy="120" r="${R}" stroke="var(--fill2)"/>${arcos}</g></svg>`;
}
function tamValor(txt){ return Math.max(20, Math.min(34, Math.floor(158 / (txt.length * 0.6)))); }
function tamBloco(txt){ return Math.max(16, Math.min(24, Math.floor(146 / (txt.length * 0.6)))); }
function horaDe(g){
  if (!g.criado_em || g.criado_em.length < 16) return '';
  const d = new Date(g.criado_em); if (isNaN(d)) return '';
  if (isoDe(d) !== g.data) return '';
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function listaGastos(gs){
  gs = [...gs].sort((a,b) => a.data !== b.data ? (a.data < b.data ? 1 : -1) : ((a.criado_em || '') < (b.criado_em || '') ? 1 : -1));
  let html = '', ult = null, abertos = false;
  gs.forEach(g => {
    if (g.data !== ult) { if (abertos) html += '</div>'; ult = g.data; html += `<div class="sh">${fmtGrupo(g.data)}</div><div class="grp">`; abertos = true; }
    const h = horaDe(g);
    html += `<a class="row" href="#/gasto/${g.id}"><span class="av ${g.pagou}">${g.pagou}</span>
      <span class="tx"><b>${esc(g.descricao || catNome(g.categoria))}</b><span>${catNome(g.categoria)}${h ? ' · ' + h : ''}</span></span>
      <span class="val">${brl(g.valor)}</span>${CHEV}</a>`;
  });
  return html + (abertos ? '</div>' : '');
}
function telaViagem(id){
  const v = viagem(id); if (!v) return naoAchou();
  store.set('vd_atual', id);
  const st = status(v);
  const r = resumo(id), lim = Number(v.limite) || 0;
  let info = fmtPeriodo(v);
  if (st === 'now') { const dia = diasEntre(v.inicio, hojeISO()) + 1, tot = v.fim ? diasEntre(v.inicio, v.fim) + 1 : null; info += ` · dia ${dia}${tot ? ' de ' + tot : ''}`; }
  else if (v.inicio && v.fim) { const n = diasEntre(v.inicio, v.fim) + 1; info += ` · ${n} dia${n===1?'':'s'}`; }
  if (v.destino) info = esc(v.destino) + ' · ' + info;
  let dias = 0;
  if (v.inicio) {
    if (st === 'now') dias = diasEntre(v.inicio, hojeISO()) + 1;
    else if (st !== 'plan' && v.fim) dias = diasEntre(v.inicio, v.fim) + 1;

let F = null;
function fmtDigitado(s){
  if (!s) return 'R$ 0';
  const [i, d] = s.split(',');
  return 'R$ ' + Number(i || 0).toLocaleString('pt-BR') + (d !== undefined ? ',' + d : '');
}
function tecla(k){
  let s = F.valor || '';
  if (k === 'apagar') s = s.slice(0, -1);
  else if (k === ',') { if (!s.includes(',')) s = (s || '0') + ','; }
  else {
    if (s.includes(',')) { if (s.split(',')[1].length >= 2) return; s += k; }
    else { if (s.replace(/^0+/, '').length >= 7) return; s = (s === '0' ? '' : s) + k; }
  }
  F.valor = s;
  const el = document.getElementById('valor');
  el.textContent = fmtDigitado(s); el.classList.toggle('zero', !parseValor(s));
  const pr = document.getElementById('previa'); if (pr) pr.textContent = previa();
}
function fmtDataPill(iso){

}

function ajudaDivisao(){
  const val = parseValor(F.valor);
  if (F.divisao === 'metade') return val ? `${brl(val/2, true)} para cada` : 'Dividido meio a meio';

}
function previa(){
  const v = viagem(F.viagem_id); if (!v) return '';

  const tot = r.total - atual + parseValor(F.valor);
  const cada = parseValor(F.valor) && F.divisao === 'metade' ? `${brl(parseValor(F.valor)/2, true)} para cada · ` : '';

async function salvarGasto(ev){

async function salvarViagem(p, msg){
  try { const nid = await rpc('vd_salvar_viagem', { p }); await carregar(); if (msg) toast(msg); return nid; }
  catch(e){ toast(e.message); return null; }
}
const MESES_L = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function isoDe(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function textoDatas(ini, fim){
  if (!ini) return '';
  const n = fim ? diasEntre(ini, fim) + 1 : 1;
  return fmtPeriodo({ inicio: ini, fim: fim || ini }) + ` · ${n} dia${n===1?'':'s'}`;
}
function escolherDatas(ini, fim){
  return new Promise(res => {
    let a = ini || null, b = fim || null;
    const base = a ? dataObj(a) : new Date();
    let mes = new Date(base.getFullYear(), base.getMonth(), 1);
    const w = document.createElement('div'); w.className = 'veil';
    document.body.appendChild(w);
    const fim_ = val => { w.remove(); res(val); };
    function desenhar(){
      const ano = mes.getFullYear(), m = mes.getMonth(), primeiro = new Date(ano, m, 1).getDay(), total = new Date(ano, m + 1, 0).getDate(), hoje = hojeISO();
      let cel = '';
      for (let i = 0; i < primeiro; i++) cel += '<span></span>';
      for (let d = 1; d <= total; d++) {
        const iso = isoDe(new Date(ano, m, d));
        let cls = '';
        if (a && iso === a) cls = 'ini';
        if (b && iso === b) cls = a === b ? 'ini fim' : 'fim';
        if (a && b && iso > a && iso < b) cls = 'meio';
        if (cls.includes('ini') && b && b !== a) cls += ' liga';
        cel += `<button type="button" class="dia ${cls}${iso === hoje ? ' hoje' : ''}" data-d="${iso}" aria-pressed="${!!cls}"><span>${d}</span></button>`;
      }
      const n = a ? (b ? diasEntre(a, b) + 1 : 1) : 0;
      const resumo = !a ? 'Toque no dia da ida' : !b ? `Ida ${fmtDia(a)} · agora toque na volta` : `${fmtPeriodo({inicio:a, fim:b})}`;
      w.innerHTML = `<div class="sheet cal-sheet" role="dialog" aria-modal="true" aria-label="Datas da viagem"><span class="grab"></span>
        <h3>Datas da viagem</h3>
        <div class="cal-top"><button type="button" class="cal-nav" data-m="-1" aria-label="Mês anterior">${sv(IC.voltar,22,2.2)}</button>
          <b>${MESES_L[m]} ${ano}</b><button type="button" class="cal-nav" data-m="1" aria-label="Próximo mês" style="transform:scaleX(-1)">${sv(IC.voltar,22,2.2)}</button></div>
        <div class="cal-sem">${['D','S','T','Q','Q','S','S'].map(x => `<span>${x}</span>`).join('')}</div>
        <div class="cal-grade">${cel}</div>
        <div class="cal-res"><span>${resumo}</span>${n ? `<b>${n} dia${n===1?'':'s'}</b>` : ''}</div>
        <button type="button" class="btn" id="cal-ok" ${a ? '' : 'disabled'}>Confirmar</button>
        <button type="button" class="btn-plain" id="cal-x">Cancelar</button></div>`;
      w.querySelectorAll('[data-m]').forEach(x => x.onclick = () => { mes = new Date(ano, m + Number(x.dataset.m), 1); desenhar(); });
      w.querySelectorAll('[data-d]').forEach(x => x.onclick = () => {
        const d = x.dataset.d;
        if (!a || (a && b)) { a = d; b = null; }
        else if (d < a) { a = d; }
        else b = d;
        desenhar();
      });
      w.querySelector('#cal-ok').onclick = () => fim_({ inicio: a, fim: b || a });
      w.querySelector('#cal-x').onclick = () => fim_(null);
    }
    w.onclick = e => { if (e.target === w) fim_(null); };
    desenhar();
  });
}
let FV = null;
function formViagem(v){
  v = v || {};
  FV = { inicio: v.inicio || '', fim: v.fim || '' };
  return `<form id="f-viagem" style="display:flex;flex-direction:column;gap:14px">
    <div class="grp">
      <label class="row" style="cursor:text"><span class="tx" style="flex:none"><b>Nome</b></span><input class="fin" id="fv-nome" required placeholder="Ex.: Argentina 2025" value="${esc(v.nome)}"></label>
      <label class="row" style="cursor:text"><span class="tx" style="flex:none"><b>Destino</b></span><input class="fin" id="fv-dest" placeholder="Ex.: Buenos Aires" value="${esc(v.destino)}"></label>
      <button type="button" class="row" id="fv-datas"><span class="tx" style="flex:none"><b>Datas</b></span><span class="val" id="fv-datas-txt" style="flex:1;text-align:right">${FV.inicio ? textoDatas(FV.inicio, FV.fim) : '<span style="color:#C7C7CC">Ida e volta</span>'}</span>${CHEV}</button>
      ${v.id ? '' : `<label class="row" style="cursor:text"><span class="tx" style="flex:none"><b>Limite</b></span><input class="fin" id="fv-lim" inputmode="decimal" placeholder="Opcional"></label>`}
    </div>
    <button class="btn" type="submit">${v.id ? 'Salvar dados' : 'Criar viagem'}</button>
    ${v.id ? '<div class="grp"><button class="row danger" type="button" id="fv-excluir" style="justify-content:center;font-weight:600">Excluir viagem</button></div>' : ''}
  </form>`;
}
function ligarFormViagem(v){
  const f = document.getElementById('f-viagem'); if (!f) return;
  document.getElementById('fv-datas').onclick = async () => {
    const r = await escolherDatas(FV.inicio, FV.fim); if (!r) return;
    FV = r; document.getElementById('fv-datas-txt').textContent = textoDatas(r.inicio, r.fim);
  };
  f.onsubmit = async ev => {
    ev.preventDefault();
    const p = { nome: document.getElementById('fv-nome').value.trim(), destino: document.getElementById('fv-dest').value.trim(), inicio: FV.inicio, fim: FV.fim };
    if (!p.nome) return;
    if (v && v.id) { p.id = v.id; salvarViagem(p, 'Viagem salva'); return; }
    p.limite = parseValor((document.getElementById('fv-lim')||{}).value);
    const nid = await salvarViagem(p, 'Viagem criada');
    if (nid) { store.set('vd_atual', nid); location.hash = '#/v/' + nid; }
  };
  const bx = document.getElementById('fv-excluir');
  if (bx) bx.onclick = async () => {
    if (!confirm(`Excluir a viagem ${v.nome} e todos os gastos dela?`)) return;
    try { await rpc('vd_excluir', { p_tipo: 'viagem', p_id: v.id }); store.set('vd_atual', null); location.hash = '#/'; await carregar(); toast('Viagem excluída'); }
    catch(e){ toast(e.message); }
  };
}
function telaNovaViagem(){
  $app.innerHTML = `
  <nav class="nav"><a href="#/">Cancelar</a><b style="font-size:17px">Nova viagem</b><span style="width:62px"></span></nav>
  <div class="foot" style="margin:0 16px">Pode ser uma que vem por aí ou uma que já aconteceu.</div>
  ${formViagem(null)}
  ${tabbar('viagens')}`;
  ligarFormViagem(null);
}

/* --- nós --- */

  const link = location.origin + location.pathname + '#k=' + chave;
  $app.innerHTML = `
  <nav class="nav"><a href="#/">${sv(IC.voltar,22,2.2)} Viagens</a><span></span></nav>
  <h1 class="t">Nós</h1>
  <div class="sh">Quem usa este celular</div>
  <div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))" role="group" aria-label="Quem usa este celular">
    ${['S','V'].map(p => `<button data-eu="${p}" aria-pressed="${eu===p}">${NOME[p]}</button>`).join('')}</div>
  <div class="foot">Quem pagou já vem marcado com o seu nome ao lançar um gasto.</div>

  <div class="grp">${CATS.map(c => `<button class="row" data-cat-ed="${c.id}"><span class="cat-ic" style="background:${c.cor}">${sv(icCat(c.id),16,2)}</span><span class="tx"><b>${esc(c.nome)}</b></span>${CHEV}</button>`).join('')}
    <button class="row" id="bt-nova-cat" style="color:var(--acc)"><span class="cat-ic nova">${sv(IC.plus,16,2.2)}</span><span class="tx"><b style="color:var(--acc)">Nova categoria</b></span></button></div>
  <div class="sh">Usar no outro celular</div>
  <div class="grp"><button class="row" id="bt-link"><span class="tile">${sv(IC.troca,18,2)}</span><span class="tx"><b>Compartilhar link do casal</b><span>Mande só entre vocês dois</span></span>${CHEV}</button></div>
  <div class="sh">Tela de início</div>
  <div class="grp"><div class="row" style="cursor:default"><span class="tx"><span style="font-size:14px;color:var(--muted2)">iPhone: no Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”. Android: no Chrome, menu ⋮ e “Adicionar à tela inicial”. Se pedir o código depois, cole o link do casal.</span></span></div></div>
  <div class="grp"><button class="row danger" id="bt-sair" style="justify-content:center;font-weight:600">Sair deste celular</button></div>
  ${tabbar('')}`;
  $app.querySelectorAll('[data-cat-ed]').forEach(b => b.onclick = async () => { const c = CATS.find(x => x.id === b.dataset.catEd); if (await editarCategoria(c)) telaNos(); });
  document.getElementById('bt-nova-cat').onclick = async () => { if (await editarCategoria(null)) telaNos(); };
  $app.querySelectorAll('[data-eu]').forEach(b => b.onclick = () => { eu = b.dataset.eu; store.set('vd_eu', eu); telaNos(); toast('Pronto, ' + NOME[eu]); });
  document.getElementById('bt-link').onclick = async () => {
    try { if (navigator.share) { await navigator.share({ title: 'Viagens a Dois', text: 'Nosso app de gastos de viagem', url: link }); return; } } catch(e){ if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(link); toast('Link copiado'); } catch(e){ prompt('Copie o link:', link); }
  };
  document.getElementById('bt-sair').onclick = () => { if (!confirm('Sair deste celular? Vai precisar do código do casal para entrar de novo.')) return; store.set('vd_chave', null); chave = null; render(); };
}

/* --- folha para digitar valor --- */
function pedirValor(titulo, atual, permiteZero){
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'veil';
    w.innerHTML = `<form class="sheet" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><span class="grab"></span><h3>${esc(titulo)}</h3>
      <input class="amount" id="pv" inputmode="decimal" style="font-size:40px" value="${Number(atual) ? 'R$ ' + String(atual).replace('.', ',') : ''}" placeholder="R$ 0">
      ${permiteZero ? '<span class="hint">Deixe vazio para tirar o limite.</span>' : ''}
      <button class="btn" type="submit">Salvar</button><button class="btn-plain" type="button" id="pv-c">Cancelar</button></form>`;
    document.body.appendChild(w);
    const i = w.querySelector('#pv'); setTimeout(() => i.focus(), 50);
    const fim = val => { w.remove(); res(val); };
    w.onclick = e => { if (e.target === w) fim(null); };
    w.querySelector('#pv-c').onclick = () => fim(null);
    w.querySelector('form').onsubmit = e => { e.preventDefault(); fim(parseValor(i.value)); };
  });
}
function naoAchou(){
  $app.innerHTML = `<div style="height:40px"></div><h1 class="t">Não encontrada</h1><div class="sub" style="margin-top:-6px">Essa viagem ou gasto não existe mais.</div>
  <a class="btn" href="#/">Voltar às viagens</a>${tabbar('viagens')}`;
}

/* ---------- rotas ---------- */
function render(){
  $app.classList.remove('folha'); document.onkeydown = null;
  if (!chave) return telaEntrar();
  if (!carregado) { $app.innerHTML = '<div class="spin" role="status" aria-label="Carregando"></div>'; return; }
  const p = (location.hash.replace(/^#\/?/, '') || '').split('/');
  window.scrollTo(0, 0);
  switch (p[0]) {
    case 'v': return telaViagem(p[1]);
    case 'gastos': return telaGastos(p[1]);
    case 'novo': return telaGasto(p[1] || idAtual(), null);
    case 'gasto': return telaGasto(null, p[1]);
    case 'acerto': return telaAcerto(p[1] || idAtual());
    case 'limite': return telaLimite(p[1] || idAtual());
    case 'nova-viagem': return telaNovaViagem();
    case 'nos': return telaNos();
    default: F = null; return telaViagens();
  }
}
function emFormulario(){ return /^#\/(novo|gasto\/|nova-viagem|limite)/.test(location.hash) || document.querySelector('.veil') || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)); }

/* ---------- atualização automática ---------- */
const VERSAO = '2026-10-27-10';
async function checarVersao(){
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const { versao } = await r.json();
    if (versao && versao !== VERSAO && !emFormulario()) {
      const h = location.hash.startsWith('#/') ? location.hash : '#/';
      location.replace(location.pathname + '?v=' + encodeURIComponent(versao) + h);
    }
  } catch(e){}
}

(function iniciar(){
  checarVersao();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checarVersao(); });
  const m = location.hash.match(/k=([A-Za-z0-9]+)/);
  if (m) { chave = m[1]; store.set('vd_chave', chave); history.replaceState(null, '', location.pathname + location.search + '#/'); }
  window.addEventListener('hashchange', () => { if (!/^#\/(novo|gasto\/)/.test(location.hash)) F = null; render(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && chave && !emFormulario()) carregar(true); });
  setInterval(() => { if (chave && document.visibilityState === 'visible' && !emFormulario()) carregar(true); }, 20000);
  if (chave) carregar(); else render();
})();
</script>
