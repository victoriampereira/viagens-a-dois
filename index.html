<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viagens a Dois</title>
<meta name="theme-color" content="#F6F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --ink:#1C1B19; --muted:#6B675F; --muted2:#4F4B44;
  --line:#E6E2DA; --line2:#D9D4CA; --seg:#EBE7E0; --track:#E9E5DE;
  --s:#2E4F7A; --s-soft:#E3E9F2;
  --v:#A8456B; --v-bar:#D9799D; --v-soft:#F7E3EA;
  --ok:#2C7A57; --warn:#9A5B12; --warn-soft:#F6EBDA;
  --serif:"Instrument Serif",Georgia,serif;
  --sans:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
a{color:var(--ink)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;
  padding:calc(env(safe-area-inset-top,0px) + 52px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 120px) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:24px}
.serif{font-family:var(--serif);font-weight:400}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1.t{margin:0;font-family:var(--serif);font-weight:400;font-size:44px;line-height:1}
.sub{font-size:14px;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12px} .money{font-variant-numeric:tabular-nums}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:-8px}
.ib{width:44px;height:44px;display:grid;place-items:center;color:var(--ink);background:none;border:0;cursor:pointer;text-decoration:none}
.ib.l{margin-left:-10px} .ib.r{margin-right:-10px}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:0 1px 0 var(--line)}
.card-s{background:var(--card);border-radius:18px;padding:14px 16px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.now{color:var(--s);background:var(--s-soft)}
.chip.plan{color:var(--muted);border:1px solid var(--line2)}
.chip.ok{color:var(--ok)}
.chip.end{color:var(--muted)}
.av{width:34px;height:34px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.av.S{background:var(--s)} .av.V{background:var(--v)}
.av.sm{width:22px;height:22px;font-size:11px}
.av.lg{width:48px;height:48px;font-size:18px}
.av.ring{border:2px solid var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.S{background:var(--s)} .dot.V{background:var(--v-bar)}
.bar{height:8px;border-radius:999px;background:var(--track);display:flex;overflow:hidden}
.bar.thin{height:6px}
.bar>span{display:block;height:100%}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.list{display:flex;flex-direction:column}
.gr{margin:14px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gr:first-child{margin-top:4px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.item:last-child{border-bottom:0}
.item .tx{flex:1;display:flex;flex-direction:column;min-width:0}
.item .tx b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx span{font-size:12px;color:var(--muted)}
.item .val{font-size:15px;font-weight:600}
.trip{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.trip:last-child{border-bottom:0}
.outline-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--line2);border-radius:16px;font-size:14px;text-decoration:none;color:inherit}
.seg{display:grid;background:var(--seg);border-radius:12px;padding:4px}
.seg button{height:38px;border:0;background:transparent;color:var(--muted2);font-size:13px;font-weight:500;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.lbl{font-size:12px;color:var(--muted);font-weight:600}
.fld{display:flex;flex-direction:column;gap:6px}
.inp{height:50px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 16px;font-size:15px;font-weight:500;width:100%}
.inp:focus{outline:2px solid var(--s);outline-offset:-1px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-size:13px;font-weight:500;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.who{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.who button{height:64px;border-radius:16px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:500;cursor:pointer}
.who button.S[aria-pressed="true"]{border:2px solid var(--s);background:var(--s-soft);font-weight:600}
.who button.V[aria-pressed="true"]{border:2px solid var(--v);background:var(--v-soft);font-weight:600}
.amount{font-family:var(--serif);font-size:64px;line-height:1.05;border:0;background:transparent;text-align:center;width:100%;padding:0;outline:none}
.amount::placeholder{color:#C9C3B8}
.btn{height:56px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.6}
.btn-text{height:44px;border:0;background:transparent;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;width:100%}
.btn-danger{color:#A3243A}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);padding:18px 20px calc(env(safe-area-inset-bottom,0px) + 22px);
  background:linear-gradient(180deg,rgba(246,244,239,0) 0%,var(--bg) 30%);display:flex;flex-direction:column;gap:10px;z-index:5}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);right:max(20px,calc(50% - 220px));width:60px;height:60px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 8px 24px rgba(28,27,25,.18);z-index:5;text-decoration:none}
.sw{width:50px;height:30px;border:0;border-radius:999px;background:#CFC9BE;position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-pressed="true"]{background:var(--ink)}
.sw[aria-pressed="true"]::after{left:23px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #EFECE6}
.setrow:last-child{border-bottom:0}
.setrow .tx{display:flex;flex-direction:column}
.setrow .tx b{font-size:15px;font-weight:600}
.setrow .tx span{font-size:12px;color:var(--muted)}
.catlim{display:flex;flex-direction:column;gap:6px;border:0;background:transparent;padding:0;width:100%;text-align:left;cursor:pointer}
.catlim .hd{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:12px 14px;font-size:14px}
.kv{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted2)} .kv span:last-child{font-weight:600}
.empty{padding:22px 0;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(env(safe-area-inset-bottom,0px) + 110px);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.veil{position:fixed;inset:0;background:rgba(28,27,25,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(480px,100%);border-radius:24px 24px 0 0;padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-family:var(--serif);font-weight:400;font-size:28px}
.grab{width:40px;height:5px;border-radius:999px;background:var(--line2);align-self:center}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:r 1s linear infinite;margin:35vh auto 0}
@keyframes r{to{transform:rotate(360deg)}}
.sel-trip{background:transparent;border:0;color:var(--muted);font-size:14px;padding:4px 18px 4px 0;cursor:pointer;-webkit-appearance:none;appearance:none;max-width:70%}
input[type=date].inp{-webkit-appearance:none;appearance:none;min-height:50px}
input[type=range]{width:100%;accent-color:var(--ink)}
</style>
</head>
<body>
<div id="app"><div class="spin" role="status" aria-label="Carregando"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const SB_URL = 'https://exfyhevmtpuxnmaifcuw.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4ZnloZXZtdHB1eG5tYWlmY3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNTc5MzksImV4cCI6MjEwODYzMzkzOX0.KS56ZtUqoK3PB0iYlI36Tt-mFAiAKcEErSZ_t0F5KzE';
const NOME = { S: 'Sérgio', V: 'Victoria' };

/* ---------- utilidades ---------- */
const $app = document.getElementById('app');
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((Number(n)||0) * 100) / 100;
function brl(n, cents){
  n = r2(n);
  const temCent = cents || Math.round(Math.abs(n)*100) % 100 !== 0;
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: temCent ? 2 : 0, maximumFractionDigits: 2 });
}
function parseValor(s){
  s = String(s||'').replace(/[^\d,.-]/g,'');
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s); return isFinite(n) ? r2(n) : 0;
}
function hojeISO(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_L = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dataObj(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function diasEntre(a,b){ return Math.round((dataObj(b) - dataObj(a)) / 86400000); }
function fmtDia(iso){ const d = dataObj(iso); return String(d.getDate()).padStart(2,'0') + ' ' + MESES[d.getMonth()]; }
function fmtCurto(v){
  if (!v.inicio) return '';
  const a = dataObj(v.inicio), b = v.fim ? dataObj(v.fim) : null, ano = new Date().getFullYear();
  const y = (b || a).getFullYear() !== ano ? ' ' + (b || a).getFullYear() : '';
  if (!b) return a.getDate() + ' ' + MESES[a.getMonth()] + y;
  if (a.getMonth() === b.getMonth()) return a.getDate() + ' – ' + b.getDate() + ' ' + MESES[b.getMonth()] + y;
  return a.getDate() + ' ' + MESES[a.getMonth()] + ' – ' + b.getDate() + ' ' + MESES[b.getMonth()] + y;
}
function fmtLongo(v){
  if (!v.inicio) return '';
  const a = dataObj(v.inicio), b = v.fim ? dataObj(v.fim) : null;
  if (!b) return a.getDate() + ' de ' + MESES_L[a.getMonth()] + ' de ' + a.getFullYear();
  if (a.getMonth() === b.getMonth()) return a.getDate() + ' – ' + b.getDate() + ' de ' + MESES_L[b.getMonth()] + (b.getFullYear() !== new Date().getFullYear() ? ' de ' + b.getFullYear() : '');
  return fmtCurto(v);
}
function fmtGrupo(iso){
  const dd = diasEntre(iso, hojeISO());
  if (dd === 0) return 'Hoje · ' + fmtDia(iso);
  if (dd === 1) return 'Ontem · ' + fmtDia(iso);
  return fmtDia(iso) + ' ' + dataObj(iso).getFullYear();
}
function toast(msg, ms){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms || 2600);
}

/* ---------- ícones ---------- */
const sv = (p, w=22, sw=1.8) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC = {
  voltar: '<path d="M15 18l-6-6 6-6"/>', seta: '<path d="M9 6l6 6-6 6"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  ajuste: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  aviso: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',
  flecha: '<path d="M2 8h34M30 2l6 6-6 6"/>'
};
const CATS = [
  { id:'comida', nome:'Comida' }, { id:'transporte', nome:'Transporte' }, { id:'hospedagem', nome:'Hospedagem' },
  { id:'passeios', nome:'Passeios' }, { id:'compras', nome:'Compras' }, { id:'outros', nome:'Outros' }
];
const catNome = id => (CATS.find(c => c.id === id) || CATS[5]).nome;

/* ---------- dados ---------- */
let chave = store.get('vd_chave');
let D = { viagens: [], gastos: [], acertos: [] };
let carregado = false;
let eu = store.get('vd_eu');

async function rpc(fn, args){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ p_chave: chave }, args || {}))
  });
  const txt = await r.text();
  let body = null; try { body = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!r.ok) { const e = new Error((body && body.message) || 'Erro ao falar com o servidor'); e.status = r.status; e.code = body && body.code; throw e; }
  return body;
}
async function carregar(silencioso){
  try {
    const novo = await rpc('vd_dados');
    const mudou = JSON.stringify(novo) !== JSON.stringify(D);
    D = novo; carregado = true;
    if (mudou || !silencioso) render();
  } catch(e) {
    if (e.code === '28000') { chave = null; store.set('vd_chave', null); render(); return; }
    if (!silencioso) { carregado = true; render(); toast('Sem conexão. Tentando de novo…'); }
  }
}
function viagem(id){ return D.viagens.find(v => v.id === id); }
function gastosDe(id){ return D.gastos.filter(g => g.viagem_id === id); }
function parteS(g){ return g.divisao === 'metade' ? 0.5 : g.divisao === 'pagador' ? (g.pagou === 'S' ? 1 : 0) : Number(g.parte_s); }
function resumo(id){
  const gs = gastosDe(id);
  let total = 0, pagoS = 0, pagoV = 0, devidoS = 0;
  const cat = {}; CATS.forEach(c => cat[c.id] = 0);
  gs.forEach(g => {
    const v = Number(g.valor); total += v;
    if (g.pagou === 'S') pagoS += v; else pagoV += v;
    devidoS += v * parteS(g);
    cat[g.categoria] = (cat[g.categoria] || 0) + v;
  });
  const acs = D.acertos.filter(a => a.viagem_id === id);
  let saldoS = pagoS - devidoS;
  acs.forEach(a => { saldoS += a.de === 'V' ? -Number(a.valor) : Number(a.valor); });
  return { gs, total: r2(total), pagoS: r2(pagoS), pagoV: r2(pagoV), parteS: r2(devidoS), parteV: r2(total - devidoS), saldoS: r2(saldoS), cat, acs };
}
function status(v){
  const h = hojeISO();
  if (v.inicio && v.inicio > h) return 'plan';
  if (v.inicio && (!v.fim || v.fim >= h)) return 'now';
  const r = resumo(v.id);
  return (r.gs.length && Math.abs(r.saldoS) < 0.01) ? 'ok' : 'end';
}
const STATUS_TXT = { now:'Em andamento', plan:'Planejada', ok:'Acertada', end:'Encerrada' };
function idAtual(){
  const salvo = store.get('vd_atual'); if (salvo && viagem(salvo)) return salvo;
  const d = destaque(); if (d) return d.id;
  return D.viagens[0] ? D.viagens[0].id : null;
}
function destaque(){
  const now = D.viagens.find(v => status(v) === 'now'); if (now) return now;
  return D.viagens.filter(v => status(v) === 'plan').sort((a,b) => a.inicio < b.inicio ? -1 : 1)[0] || null;
}
function alertaDe(v, r){
  if (!v.alerta_ligado || !(Number(v.limite) > 0)) return null;
  const pct = r.total / Number(v.limite) * 100;
  if (pct >= 100) return `Vocês passaram do limite: ${brl(r.total)} de ${brl(v.limite)}.`;
  if (pct >= v.alerta_pct) return `Atenção: já usaram ${Math.floor(pct)}% do limite. Restam ${brl(Number(v.limite) - r.total)}.`;
  return null;
}
function fraseSaldo(r){
  if (Math.abs(r.saldoS) < 0.01) return 'Tudo acertado entre vocês';
  return r.saldoS > 0 ? `Victoria deve <strong>${brl(r.saldoS)}</strong> ao Sérgio` : `Sérgio deve <strong>${brl(-r.saldoS)}</strong> à Victoria`;
}
function barraPessoas(r, lim){
  const base = Math.max(Number(lim)||0, r.total) || 1;
  return `<div class="bar"><span style="width:${r.pagoS/base*100}%;background:var(--s)"></span><span style="width:${r.pagoV/base*100}%;background:var(--v-bar)"></span></div>`;
}
const legenda = r => `<div class="legend"><span><span class="dot S"></span>Sérgio ${brl(r.pagoS)}</span><span><span class="dot V"></span>Victoria ${brl(r.pagoV)}</span></div>`;
const divTxt = g => g.divisao === 'metade' ? 'metade cada' : g.divisao === 'pagador' ? (g.pagou === 'S' ? 'só dele' : 'só dela') : `${Math.round(parteS(g)*100)}/${100-Math.round(parteS(g)*100)}`;

/* ---------- telas ---------- */
function telaEntrar(){
  $app.innerHTML = `
  <header style="display:flex;flex-direction:column;gap:4px">
    <span class="eyebrow">Sérgio &amp; Victoria</span>
    <h1 class="t">Viagens a Dois</h1>
  </header>
  <form id="f-entrar" class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="fld"><label class="lbl" for="cod">Código do casal</label>
      <input class="inp" id="cod" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Cole aqui o link ou o código"></div>
    <p class="small muted" style="margin:0">Ele fica salvo neste celular.</p>
    <button class="btn" type="submit">Entrar</button>
  </form>`;
  document.getElementById('f-entrar').onsubmit = async ev => {
    ev.preventDefault();
    const c = document.getElementById('cod').value.trim().replace(/^.*#k=/, '');
    if (!c) return;
    chave = c;
    try { await rpc('vd_dados'); store.set('vd_chave', c); location.hash = '#/'; carregar(); }
    catch(e){ chave = null; toast(e.code === '28000' ? 'Código não encontrado' : 'Sem conexão'); }
  };
}

function telaViagens(){
  const dest = destaque();
  const outras = D.viagens.filter(v => !dest || v.id !== dest.id);
  let cartao;
  if (dest) {
    const r = resumo(dest.id), lim = Number(dest.limite) || 0, st = status(dest);
    let quando = fmtCurto(dest);
    let linha = dest.destino ? esc(dest.destino) : '';
    if (st === 'now') { const dia = diasEntre(dest.inicio, hojeISO()) + 1, tot = dest.fim ? diasEntre(dest.inicio, dest.fim) + 1 : null; linha = `Dia ${dia}${tot ? ' de ' + tot : ''}`; }
    else { const n = diasEntre(hojeISO(), dest.inicio); linha = `Faltam ${n} dia${n===1?'':'s'}`; }
    const al = alertaDe(dest, r);
    cartao = `<a href="#/v/${dest.id}" class="card" style="text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="chip ${st}">${STATUS_TXT[st]}</span><span style="font-size:13px" class="muted">${quando}</span></div>
      <div style="display:flex;flex-direction:column;gap:2px"><span class="serif" style="font-size:38px;line-height:1.05">${esc(dest.nome)}</span><span class="sub">${linha}</span></div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="money" style="font-size:22px;font-weight:700;letter-spacing:-.01em">${brl(r.total)}</span><span class="muted" style="font-size:13px">${lim ? 'de ' + brl(lim) : 'sem limite'}</span></div>
        ${barraPessoas(r, lim)}${legenda(r)}
      </div></a>${al ? `<div class="alert" style="margin-top:-12px">${sv(IC.aviso,20)}<span>${al}</span></div>` : ''}`;
  } else {
    cartao = `<div class="card" style="display:flex;flex-direction:column;gap:12px">
      <span class="serif" style="font-size:30px;line-height:1.1">${D.viagens.length ? 'Nenhuma viagem agora' : 'A primeira viagem'}</span>
      <span class="sub">${D.viagens.length ? 'Que tal planejar a próxima?' : 'Criem uma viagem para começar a lançar os gastos. Pode ser uma que já passou.'}</span></div>`;
  }
  const lista = outras.map(v => {
    const r = resumo(v.id), st = status(v), lim = Number(v.limite);
    const det = st === 'plan' ? `${fmtCurto(v)}${lim ? ' · limite ' + brl(lim) : ''}` : `${fmtCurto(v)}${fmtCurto(v)?' · ':''}${brl(r.total)}${lim ? ' de ' + brl(lim) : ''}`;
    return `<a class="trip" href="#/v/${v.id}">
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="serif" style="font-size:24px;line-height:1.15">${esc(v.nome)}</span><span class="muted" style="font-size:13px">${det}</span></div>
      <span class="chip ${st}">${STATUS_TXT[st]}</span></a>`;
  }).join('');
  $app.innerHTML = `
  <header style="display:flex;justify-content:space-between;align-items:flex-end">
    <div style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">Sérgio &amp; Victoria</span><h1 class="t">Viagens</h1></div>
    <a href="#/nos" aria-label="Nós: configurações do casal" style="display:flex;text-decoration:none"><span class="av S ring">S</span><span class="av V ring" style="margin-left:-10px">V</span></a>
  </header>
  ${cartao}
  ${outras.length ? `<section class="list"><h2 class="eyebrow" style="margin:0 0 4px">Próximas e anteriores</h2>${lista}</section>` : ''}
  <div class="bottom"><a class="btn" href="#/nova-viagem">${sv(IC.plus,18,2)} Nova viagem</a></div>`;
}

let abaViagem = {};
function telaViagem(id, abaUrl){
  const v = viagem(id); if (!v) return naoAchou();
  store.set('vd_atual', id);
  const st = status(v);
  const aba = abaUrl || abaViagem[id] || ((st === 'ok' || st === 'end') ? 'categorias' : 'gastos');
  const r = resumo(id), lim = Number(v.limite) || 0;
  let info = fmtLongo(v);
  if (st === 'now') { const dia = diasEntre(v.inicio, hojeISO()) + 1, tot = v.fim ? diasEntre(v.inicio, v.fim) + 1 : null; info += ` · dia ${dia}${tot ? ' de ' + tot : ''}`; }
  else if (st !== 'plan') info += (info ? ' · ' : '') + STATUS_TXT[st].toLowerCase();
  if (v.destino) info = esc(v.destino) + (info ? ' · ' + info : '');

  let barra = '';
  if (lim) {
    const pct = Math.min(100, r.total/lim*100), passou = r.total > lim;
    let resta = passou ? `Passaram ${brl(r.total - lim)} do limite` : `Restam ${brl(lim - r.total)}`;
    if (!passou && st === 'now' && v.fim) { const dl = diasEntre(hojeISO(), v.fim) + 1; if (dl > 0) resta += ` · ~${brl(Math.floor((lim - r.total)/dl))}/dia`; }
    barra = `<div style="position:relative;height:8px;border-radius:999px;background:var(--track)">
        <span style="position:absolute;left:0;top:0;bottom:0;width:${pct}%;border-radius:999px;background:${passou?'var(--warn)':'var(--ink)'}"></span>
        ${v.alerta_ligado ? `<span style="position:absolute;left:${v.alerta_pct}%;top:-4px;width:2px;height:16px;background:var(--v);border-radius:1px"></span>` : ''}</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;gap:8px" class="muted"><span>${resta}</span>${v.alerta_ligado ? `<span style="color:var(--v);font-weight:600;white-space:nowrap">aviso em ${v.alerta_pct}%</span>` : ''}</div>`;
  }

  let corpo = '';
  if (aba === 'gastos') {
    let html = '', ult = null;
    r.gs.forEach(g => {
      if (g.data !== ult) { ult = g.data; html += `<h3 class="gr">${fmtGrupo(g.data)}</h3>`; }
      html += `<a class="item" href="#/gasto/${g.id}"><span class="dot ${g.pagou}"></span>
        <span class="tx"><b>${esc(g.descricao || catNome(g.categoria))}</b><span>${catNome(g.categoria)} · ${NOME[g.pagou]} · ${divTxt(g)}</span></span>
        <span class="val money">${brl(g.valor)}</span></a>`;
    });
    corpo = `<section class="list">${html || '<div class="empty">Nenhum gasto ainda. Toque no + para lançar.</div>'}</section>`;
  } else {
    const maior = Math.max(...Object.values(r.cat), 0.01), lc = v.limites_cat || {};
    const linhas = CATS.filter(c => r.cat[c.id] > 0 || Number(lc[c.id]) > 0).sort((a,b) => r.cat[b.id] - r.cat[a.id]).map(c => {
      const val = r.cat[c.id], pc = r.total ? Math.round(val/r.total*100) : 0, l = Number(lc[c.id]) || 0, passou = l && val > l;
      return `<div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;font-size:14px;gap:8px"><span style="font-weight:600">${c.nome} <span class="muted" style="font-weight:400">· ${pc}%</span></span>
        <span class="money" style="${passou?'color:var(--warn);font-weight:600':''}">${brl(val)}${l ? ' / ' + brl(l) : ''}</span></div>
        <div class="bar thin"><span style="width:${val/maior*100}%;background:${passou?'var(--warn)':'var(--ink)'};border-radius:999px"></span></div></div>`;
    }).join('');
    corpo = `<section style="display:flex;flex-direction:column;gap:14px">${linhas || '<div class="empty">Ainda não há gastos.</div>'}</section>`;
  }
  const al = alertaDe(v, r);
  $app.innerHTML = `
  <nav class="nav"><a class="ib l" href="#/" aria-label="Voltar">${sv(IC.voltar)}</a><a class="ib r" href="#/limite/${id}" aria-label="Limite e alertas">${sv(IC.ajuste)}</a></nav>
  <header style="display:flex;flex-direction:column;gap:2px;margin-top:-6px"><h1 class="t">${esc(v.nome)}</h1><span class="sub">${info}</span></header>
  <section style="display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="money" style="font-size:34px;font-weight:700;letter-spacing:-.02em">${brl(r.total)}</span><span class="muted" style="font-size:13px">${lim ? 'de ' + brl(lim) : '<a href="#/limite/'+id+'" style="color:var(--muted)">definir limite</a>'}</span></div>
    ${barra}
  </section>
  ${al ? `<div class="alert" style="margin-top:-8px">${sv(IC.aviso,20)}<span>${al}</span></div>` : ''}
  <section style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    ${['S','V'].map(p => `<div class="card-s" style="display:flex;flex-direction:column;gap:6px"><span style="display:flex;align-items:center;gap:8px;font-size:13px" class="muted"><span class="av sm ${p}">${p}</span>${NOME[p]} pagou</span><span class="money" style="font-size:20px;font-weight:700">${brl(p==='S'?r.pagoS:r.pagoV)}</span></div>`).join('')}
  </section>
  ${r.gs.length ? `<a class="outline-row" href="#/acerto/${id}"><span>${fraseSaldo(r)}</span>${sv(IC.seta,18)}</a>` : ''}
  <div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))" role="group" aria-label="Ver">
    <button data-aba="gastos" aria-pressed="${aba==='gastos'}">Gastos</button><button data-aba="categorias" aria-pressed="${aba==='categorias'}">Por categoria</button>
  </div>
  ${corpo}
  <a class="fab" href="#/novo/${id}" aria-label="Lançar gasto">${sv(IC.plus,24,2)}</a>`;
  $app.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { abaViagem[id] = b.dataset.aba; history.replaceState(null, '', '#/v/' + id); telaViagem(id, b.dataset.aba); });
}

/* --- novo / editar gasto --- */
let F = null;
function telaGasto(viagemId, gastoId){
  const g = gastoId ? D.gastos.find(x => x.id === gastoId) : null;
  if (gastoId && !g) return naoAchou();
  const vid = g ? g.viagem_id : viagemId;
  if (!vid) { location.hash = '#/nova-viagem'; return; }
  if (!viagem(vid)) return naoAchou();
  const k = g ? 'g:' + g.id : 'n:' + vid;
  if (!F || F.k !== k) {
    F = g ? { k, id: g.id, viagem_id: vid, valor: String(g.valor).replace('.', ','), descricao: g.descricao, categoria: g.categoria, pagou: g.pagou, divisao: g.divisao, pct: Math.round(parteS(g)*100), data: g.data }
          : { k, viagem_id: vid, valor: '', descricao: '', categoria: 'comida', pagou: eu || 'S', divisao: 'metade', pct: 50, data: hojeISO() };
  }
  const v = viagem(F.viagem_id);
  const opcoes = D.viagens.map(x => `<option value="${x.id}" ${x.id===F.viagem_id?'selected':''}>${esc(x.nome)}</option>`).join('');
  $app.innerHTML = `
  <nav class="nav">${g ? `<span class="sub">${esc(v.nome)}</span>` : `<label for="sel-v" style="position:absolute;width:1px;height:1px;overflow:hidden">Viagem</label><select id="sel-v" class="sel-trip">${opcoes}</select>`}
    <a class="ib r" href="#/v/${vid}" aria-label="Fechar">${sv(IC.x)}</a></nav>
  <form id="f-gasto" style="display:flex;flex-direction:column;gap:24px">
    <header style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 0">
      <h1 class="eyebrow" style="margin:0"><label for="in-valor">${g ? 'Editar gasto' : 'Novo gasto'}</label></h1>
      <input id="in-valor" class="amount money" inputmode="decimal" placeholder="R$ 0" value="${esc(F.valor ? 'R$ ' + F.valor : '')}" autocomplete="off">
      <span class="small muted" id="ajuda">${ajudaDivisao()}</span>
    </header>
    <div class="fld"><label class="lbl" for="in-desc">Descrição</label><input id="in-desc" class="inp" placeholder="Ex.: Jantar, Uber, museu" value="${esc(F.descricao)}" autocomplete="off"></div>
    <div class="fld"><span class="lbl">Categoria</span><div class="pills" role="group" aria-label="Categoria">
      ${CATS.map(c => `<button type="button" class="pill" data-cat="${c.id}" aria-pressed="${F.categoria===c.id}">${c.nome}</button>`).join('')}</div></div>
    <div class="fld"><span class="lbl">Quem pagou</span><div class="who" role="group" aria-label="Quem pagou">
      ${['S','V'].map(p => `<button type="button" class="${p}" data-pagou="${p}" aria-pressed="${F.pagou===p}"><span class="av ${p}" style="width:30px;height:30px">${p}</span>${NOME[p]}</button>`).join('')}</div></div>
    <div class="fld"><span class="lbl">Divisão</span><div class="seg" style="grid-template-columns:repeat(3,minmax(0,1fr))" role="group" aria-label="Divisão">
      <button type="button" data-div="metade" aria-pressed="${F.divisao==='metade'}">Metade cada</button>
      <button type="button" data-div="pagador" aria-pressed="${F.divisao==='pagador'}">Só de quem pagou</button>
      <button type="button" data-div="outra" aria-pressed="${F.divisao==='outra'}">Outra</button></div>
      ${F.divisao === 'outra' ? `<label for="in-pct" class="small muted" style="margin-top:8px">Parte do Sérgio: <strong id="pct-a">${F.pct}%</strong> · Victoria: <strong id="pct-b">${100-F.pct}%</strong></label>
        <input id="in-pct" type="range" min="0" max="100" step="5" value="${F.pct}">` : ''}
    </div>
    <div class="fld"><label class="lbl" for="in-data">Data</label><input id="in-data" class="inp" type="date" value="${F.data}"></div>
    ${g ? '<button class="btn-text btn-danger" type="button" id="bt-excluir">Excluir gasto</button>' : ''}
    <div style="height:70px"></div>
    <div class="bottom">
      <span class="muted" style="font-size:13px;text-align:center" id="previa">${previa()}</span>
      <button class="btn" type="submit" id="bt-salvar">${g ? 'Salvar' : 'Lançar gasto'}</button>
    </div>
  </form>`;
  const upd = () => { document.getElementById('ajuda').textContent = ajudaDivisao(); document.getElementById('previa').textContent = previa(); };
  const iv = document.getElementById('in-valor');
  iv.oninput = () => { F.valor = iv.value.replace(/[^\d,.]/g,''); upd(); };
  document.getElementById('in-desc').oninput = e => F.descricao = e.target.value;
  document.getElementById('in-data').onchange = e => F.data = e.target.value || hojeISO();
  const ip = document.getElementById('in-pct');
  if (ip) ip.oninput = () => { F.pct = Number(ip.value); document.getElementById('pct-a').textContent = F.pct + '%'; document.getElementById('pct-b').textContent = (100-F.pct) + '%'; upd(); };
  const sel = document.getElementById('sel-v');
  if (sel) sel.onchange = () => { F.viagem_id = sel.value; F.k = 'n:' + sel.value; store.set('vd_atual', sel.value); history.replaceState(null,'','#/novo/' + sel.value); upd(); };
  $app.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { F.categoria = b.dataset.cat; $app.querySelectorAll('[data-cat]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $app.querySelectorAll('[data-pagou]').forEach(b => b.onclick = () => { F.pagou = b.dataset.pagou; $app.querySelectorAll('[data-pagou]').forEach(x => x.setAttribute('aria-pressed', x === b)); upd(); });
  $app.querySelectorAll('[data-div]').forEach(b => b.onclick = () => { F.divisao = b.dataset.div; telaGasto(viagemId, gastoId); });
  document.getElementById('f-gasto').onsubmit = salvarGasto;
  const bx = document.getElementById('bt-excluir');
  if (bx) bx.onclick = async () => {
    if (!confirm('Excluir este gasto?')) return;
    try { await rpc('vd_excluir', { p_tipo: 'gasto', p_id: F.id }); F = null; toast('Gasto excluído'); location.hash = '#/v/' + vid; carregar(); }
    catch(e){ toast(e.message); }
  };
}
function ajudaDivisao(){
  const val = parseValor(F.valor);
  if (F.divisao === 'metade') return val ? `${brl(val/2, true)} para cada` : 'Dividido meio a meio';
  if (F.divisao === 'pagador') return `Fica todo na conta ${F.pagou==='S'?'do Sérgio':'da Victoria'}`;
  return val ? `Sérgio ${brl(val*F.pct/100, true)} · Victoria ${brl(val*(100-F.pct)/100, true)}` : 'Escolha a parte de cada um';
}
function previa(){
  const v = viagem(F.viagem_id), lim = Number(v && v.limite) || 0; if (!v) return '';
  const r = resumo(v.id), atual = F.id ? (Number((D.gastos.find(x => x.id === F.id) || {}).valor) || 0) : 0;
  const tot = r.total - atual + parseValor(F.valor);
  return lim ? `Com este gasto: ${brl(tot)} de ${brl(lim)} (${Math.round(tot/lim*100)}%)` : `Com este gasto: ${brl(tot)} na viagem`;
}
async function salvarGasto(ev){
  ev.preventDefault();
  const valor = parseValor(F.valor);
  if (!(valor > 0)) { toast('Digite o valor do gasto'); document.getElementById('in-valor').focus(); return; }
  const v = viagem(F.viagem_id), antes = resumo(v.id).total;
  const bt = document.getElementById('bt-salvar'); bt.disabled = true; bt.textContent = 'Salvando…';
  const p = { viagem_id: F.viagem_id, valor, descricao: F.descricao.trim(), categoria: F.categoria, pagou: F.pagou, divisao: F.divisao,
              parte_s: F.divisao === 'outra' ? F.pct/100 : (F.divisao === 'metade' ? 0.5 : (F.pagou === 'S' ? 1 : 0)), data: F.data };
  if (F.id) p.id = F.id;
  try {
    await rpc('vd_salvar_gasto', { p });
    const ed = !!F.id; F = null;
    await carregar(true);
    const depois = resumo(v.id).total, lim = Number(v.limite) || 0;
    let msg = ed ? 'Gasto atualizado' : 'Gasto lançado';
    if (v.alerta_ligado && lim) {
      const pa = antes/lim*100, pd = depois/lim*100;
      if (pd >= 100 && pa < 100) msg = `Atenção: vocês passaram do limite de ${v.nome}`;
      else if (pd >= v.alerta_pct && pa < v.alerta_pct) msg = `Atenção: chegaram a ${Math.floor(pd)}% do limite de ${v.nome}`;
    }
    location.hash = '#/v/' + v.id; toast(msg, 3600);
  } catch(e) { bt.disabled = false; bt.textContent = 'Tentar de novo'; toast(e.message); }
}

/* --- acerto --- */
function telaAcerto(id){
  const v = viagem(id); if (!v) return naoAchou();
  const r = resumo(id), zerado = Math.abs(r.saldoS) < 0.01;
  const deve = r.saldoS > 0 ? 'V' : 'S', recebe = deve === 'V' ? 'S' : 'V', val = Math.abs(r.saldoS);
  const outros = D.acertos.filter(a => a.viagem_id !== id).slice(0, 4);
  const hist = r.acs.map(a => `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px" class="muted">
      <span>${NOME[a.de]} pagou ${brl(a.valor)} · ${fmtDia(a.em.slice(0,10))}</span><button class="pill" data-desfaz="${a.id}" style="height:32px">Desfazer</button></div>`).join('');
  const antigos = outros.map(a => { const vv = viagem(a.viagem_id); return vv ? `<div style="display:flex;justify-content:space-between;font-size:14px;color:var(--muted2)"><span>${esc(vv.nome)} · ${NOME[a.de]} pagou ${brl(a.valor)}</span><span>${fmtDia(a.em.slice(0,10))}</span></div>` : ''; }).join('');
  $app.innerHTML = `
  <nav class="nav" style="justify-content:flex-start;gap:4px"><a class="ib l" href="#/v/${id}" aria-label="Voltar">${sv(IC.voltar)}</a><span class="sub">${esc(v.nome)}</span></nav>
  <header style="display:flex;flex-direction:column;gap:6px"><h1 class="t">Acerto de contas</h1><span class="sub">Para ficar como combinaram até agora</span></header>
  <section class="card" style="display:flex;flex-direction:column;align-items:center;gap:18px;padding:26px 22px">
    ${zerado ? `<span class="serif" style="font-size:40px;line-height:1.05;text-align:center">Tudo certo</span><span class="sub" style="text-align:center">Ninguém deve nada nesta viagem.</span>` : `
    <div style="display:flex;align-items:center;gap:14px"><span class="av lg ${deve}">${deve}</span>
      <svg width="40" height="16" viewBox="0 0 40 16" fill="none" stroke="#6B675F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h34M30 2l6 6-6 6"/></svg>
      <span class="av lg ${recebe}">${recebe}</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px"><span class="sub">${NOME[deve]} deve ${recebe==='S'?'ao':'à'} ${NOME[recebe]}</span>
      <span class="serif money" style="font-size:60px;line-height:1.05">${brl(val)}</span></div>`}
  </section>
  <section class="list">
    <div class="kv"><span>Total da viagem</span><span class="money">${brl(r.total)}</span></div>
    <div class="kv"><span>Parte do Sérgio</span><span class="money">${brl(r.parteS)}</span></div>
    <div class="kv"><span style="display:flex;align-items:center;gap:8px"><span class="dot S"></span>Sérgio pagou ${brl(r.pagoS)}</span><span class="money" style="color:${r.pagoS-r.parteS>=0?'var(--ok)':'var(--v)'}">${r.pagoS-r.parteS>=0?'+':'−'} ${brl(Math.abs(r.pagoS-r.parteS))}</span></div>
    <div class="kv"><span style="display:flex;align-items:center;gap:8px"><span class="dot V"></span>Victoria pagou ${brl(r.pagoV)}</span><span class="money" style="color:${r.pagoV-r.parteV>=0?'var(--ok)':'var(--v)'}">${r.pagoV-r.parteV>=0?'+':'−'} ${brl(Math.abs(r.pagoV-r.parteV))}</span></div>
  </section>
  ${hist ? `<section style="display:flex;flex-direction:column;gap:10px"><h2 class="eyebrow" style="margin:0">Acertos desta viagem</h2>${hist}</section>` : ''}
  ${antigos ? `<section style="display:flex;flex-direction:column;gap:8px"><h2 class="eyebrow" style="margin:0">Acertos anteriores</h2>${antigos}</section>` : ''}
  <div style="height:90px"></div>
  ${zerado ? '' : `<div class="bottom"><button class="btn" id="bt-acertar">Marcar como acertado</button><button class="btn-text" id="bt-copiar">Copiar valor para o Pix</button></div>`}`;
  const bc = document.getElementById('bt-copiar');
  if (bc) bc.onclick = async () => { const t = val.toFixed(2).replace('.', ','); try { await navigator.clipboard.writeText(t); toast('Valor copiado: ' + t); } catch(e){ toast(t); } };
  const ba = document.getElementById('bt-acertar');
  if (ba) ba.onclick = async () => {
    if (!confirm(`Confirmar que ${NOME[deve]} pagou ${brl(val, true)} ${recebe==='S'?'ao':'à'} ${NOME[recebe]}?`)) return;
    ba.disabled = true;
    try { await rpc('vd_acertar', { p_viagem: id, p_de: deve, p_valor: r2(val) }); await carregar(); toast('Contas acertadas'); }
    catch(e){ ba.disabled = false; toast(e.message); }
  };
  $app.querySelectorAll('[data-desfaz]').forEach(b => b.onclick = async () => {
    if (!confirm('Desfazer este acerto?')) return;
    try { await rpc('vd_excluir', { p_tipo: 'acerto', p_id: b.dataset.desfaz }); await carregar(); toast('Acerto desfeito'); } catch(e){ toast(e.message); }
  });
}

/* --- limite e alertas --- */
function telaLimite(id){
  const v = viagem(id); if (!v) return naoAchou();
  const r = resumo(id), lc = v.limites_cat || {};
  const cats = CATS.map(c => {
    const val = r.cat[c.id] || 0, l = Number(lc[c.id]) || 0, pc = l ? Math.min(100, val/l*100) : 0, quente = l && val/l*100 >= v.alerta_pct;
    return `<button class="catlim" data-lim="${c.id}"><span class="hd"><span style="font-weight:600">${c.nome}</span>
      <span class="money" style="${quente?'color:var(--v);font-weight:600':'color:var(--muted)'}">${brl(val)} / ${l ? brl(l) : '<span style="text-decoration:underline">definir</span>'}</span></span>
      <span class="bar thin" style="width:100%"><span style="width:${pc}%;background:${quente?'var(--v)':'var(--ink)'};border-radius:999px"></span></span></button>`;
  }).join('');
  $app.innerHTML = `
  <nav class="nav" style="justify-content:flex-start;gap:4px"><a class="ib l" href="#/v/${id}" aria-label="Voltar">${sv(IC.voltar)}</a><span class="sub">${esc(v.nome)}</span></nav>
  <header style="display:flex;flex-direction:column;gap:12px"><h1 class="t">Limite</h1>
    <div class="fld"><span class="lbl">Limite total da viagem</span>
      <button class="inp" id="bt-lim" style="height:60px;font-size:24px;font-weight:700;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center">${Number(v.limite) ? brl(v.limite) : '<span class="muted" style="font-size:17px;font-weight:500">Definir limite</span>'}${sv(IC.seta,18)}</button></div>
  </header>
  <section style="display:flex;flex-direction:column;gap:14px"><h2 class="eyebrow" style="margin:0">Por categoria</h2>${cats}
    <p class="small muted" style="margin:0">Toque numa categoria para definir o limite dela.</p></section>
  <section class="card" style="padding:4px 16px;border-radius:18px">
    <div class="setrow"><span class="tx"><b>Avisar ao chegar em ${v.alerta_pct}%</b><span>Do total e de cada categoria</span></span>
      <button class="sw" id="sw-alerta" aria-pressed="${v.alerta_ligado}" aria-label="Avisar ao chegar em ${v.alerta_pct}%"></button></div>
    <div class="setrow"><span class="tx"><b>Quando avisar</b></span><span class="pills">${[70,80,90].map(n => `<button class="pill" data-pct="${n}" aria-pressed="${v.alerta_pct===n}" style="height:32px">${n}%</button>`).join('')}</span></div>
    <div class="setrow"><span class="tx"><b>Avisar os dois</b><span>Sérgio e Victoria veem o aviso</span></span>
      <button class="sw" id="sw-ambos" aria-pressed="${v.alerta_ambos}" aria-label="Avisar os dois"></button></div>
  </section>
  <section style="display:flex;flex-direction:column;gap:14px"><h2 class="eyebrow" style="margin:0">Dados da viagem</h2>${formViagem(v)}</section>`;
  document.getElementById('bt-lim').onclick = async () => { const n = await pedirValor('Limite da viagem', v.limite); if (n == null) return; salvarViagem({ id, limite: n }, 'Limite salvo'); };
  $app.querySelectorAll('[data-lim]').forEach(b => b.onclick = async () => {
    const c = b.dataset.lim, n = await pedirValor('Limite de ' + catNome(c), lc[c] || 0, true); if (n == null) return;
    const novo = Object.assign({}, lc); if (n > 0) novo[c] = n; else delete novo[c];
    salvarViagem({ id, limites_cat: novo }, 'Limite salvo');
  });
  document.getElementById('sw-alerta').onclick = () => salvarViagem({ id, alerta_ligado: !v.alerta_ligado });
  document.getElementById('sw-ambos').onclick = () => salvarViagem({ id, alerta_ambos: !v.alerta_ambos });
  $app.querySelectorAll('[data-pct]').forEach(b => b.onclick = () => salvarViagem({ id, alerta_pct: Number(b.dataset.pct) }));
  ligarFormViagem(v);
}
async function salvarViagem(p, msg){
  try { const nid = await rpc('vd_salvar_viagem', { p }); await carregar(); if (msg) toast(msg); return nid; }
  catch(e){ toast(e.message); return null; }
}
function formViagem(v){
  v = v || {};
  return `<form id="f-viagem" style="display:flex;flex-direction:column;gap:16px">
    <div class="fld"><label class="lbl" for="fv-nome">Nome da viagem</label><input class="inp" id="fv-nome" required placeholder="Ex.: Argentina 2025" value="${esc(v.nome)}"></div>
    <div class="fld"><label class="lbl" for="fv-dest">Destino</label><input class="inp" id="fv-dest" placeholder="Ex.: Buenos Aires e Mendoza" value="${esc(v.destino)}"></div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <div class="fld"><label class="lbl" for="fv-ini">Ida</label><input class="inp" id="fv-ini" type="date" value="${v.inicio||''}"></div>
      <div class="fld"><label class="lbl" for="fv-fim">Volta</label><input class="inp" id="fv-fim" type="date" value="${v.fim||''}"></div>
    </div>
    ${v.id ? '' : `<div class="fld"><label class="lbl" for="fv-lim">Limite de gastos (opcional)</label><input class="inp" id="fv-lim" inputmode="decimal" placeholder="R$ 0"></div>`}
    <button class="btn" type="submit">${v.id ? 'Salvar dados' : 'Criar viagem'}</button>
    ${v.id ? '<button class="btn-text btn-danger" type="button" id="fv-excluir">Excluir viagem</button>' : ''}
  </form>`;
}
function ligarFormViagem(v){
  const f = document.getElementById('f-viagem'); if (!f) return;
  f.onsubmit = async ev => {
    ev.preventDefault();
    const p = { nome: document.getElementById('fv-nome').value.trim(), destino: document.getElementById('fv-dest').value.trim(),
                inicio: document.getElementById('fv-ini').value, fim: document.getElementById('fv-fim').value };
    if (!p.nome) return;
    if (p.inicio && p.fim && p.fim < p.inicio) { toast('A volta está antes da ida'); return; }
    if (v && v.id) { p.id = v.id; salvarViagem(p, 'Viagem salva'); return; }
    p.limite = parseValor((document.getElementById('fv-lim')||{}).value);
    const nid = await salvarViagem(p, 'Viagem criada');
    if (nid) { store.set('vd_atual', nid); location.hash = '#/v/' + nid; }
  };
  const bx = document.getElementById('fv-excluir');
  if (bx) bx.onclick = async () => {
    if (!confirm(`Excluir a viagem ${v.nome} e todos os gastos dela?`)) return;
    try { await rpc('vd_excluir', { p_tipo: 'viagem', p_id: v.id }); store.set('vd_atual', null); location.hash = '#/'; await carregar(); toast('Viagem excluída'); }
    catch(e){ toast(e.message); }
  };
}
function telaNovaViagem(){
  $app.innerHTML = `
  <nav class="nav"><a class="ib l" href="#/" aria-label="Voltar">${sv(IC.voltar)}</a></nav>
  <header style="display:flex;flex-direction:column;gap:6px"><h1 class="t">Nova viagem</h1><span class="sub">Pode ser uma que vem por aí ou uma que já aconteceu</span></header>
  ${formViagem(null)}`;
  ligarFormViagem(null);
}

/* --- nós --- */
function telaNos(){
  const link = location.origin + location.pathname + '#k=' + chave;
  $app.innerHTML = `
  <nav class="nav"><a class="ib l" href="#/" aria-label="Voltar">${sv(IC.voltar)}</a></nav>
  <header style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">Sérgio &amp; Victoria</span><h1 class="t">Nós</h1></header>
  <section class="fld"><span class="lbl">Quem usa este celular?</span>
    <div class="who" role="group" aria-label="Quem usa este celular">${['S','V'].map(p => `<button class="${p}" data-eu="${p}" aria-pressed="${eu===p}"><span class="av ${p}" style="width:30px;height:30px">${p}</span>${NOME[p]}</button>`).join('')}</div>
    <span class="small muted">Quem pagou já vem marcado com o seu nome ao lançar um gasto.</span></section>
  <section class="card" style="display:flex;flex-direction:column;gap:12px;padding:18px">
    <b>Usar no outro celular</b>
    <span class="small muted">Mande o link do casal só entre vocês: quem tiver o link vê e lança gastos.</span>
    <button class="btn" id="bt-link">Compartilhar link do casal</button></section>
  <section class="card" style="display:flex;flex-direction:column;gap:8px;padding:18px">
    <b>Colocar na tela de início</b>
    <span class="small muted">iPhone: no Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”. Android: no Chrome, menu ⋮ e “Adicionar à tela inicial”. Se o app pedir o código depois, cole o link do casal.</span></section>
  <button class="btn-text btn-danger" id="bt-sair">Sair deste celular</button>`;
  $app.querySelectorAll('[data-eu]').forEach(b => b.onclick = () => { eu = b.dataset.eu; store.set('vd_eu', eu); telaNos(); toast('Pronto, ' + NOME[eu]); });
  document.getElementById('bt-link').onclick = async () => {
    try { if (navigator.share) { await navigator.share({ title: 'Viagens a Dois', text: 'Nosso app de gastos de viagem', url: link }); return; } } catch(e){ if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(link); toast('Link copiado'); } catch(e){ prompt('Copie o link:', link); }
  };
  document.getElementById('bt-sair').onclick = () => { if (!confirm('Sair deste celular? Vai precisar do link do casal para entrar de novo.')) return; store.set('vd_chave', null); chave = null; render(); };
}

/* --- folha para digitar valor --- */
function pedirValor(titulo, atual, permiteZero){
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'veil';
    w.innerHTML = `<form class="sheet" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><span class="grab"></span><h3>${esc(titulo)}</h3>
      <input class="inp money" id="pv" inputmode="decimal" style="font-size:24px;height:60px;font-weight:700" value="${Number(atual) ? 'R$ ' + String(atual).replace('.', ',') : ''}" placeholder="R$ 0">
      ${permiteZero ? '<span class="small muted">Deixe vazio para tirar o limite.</span>' : ''}
      <button class="btn" type="submit">Salvar</button><button class="btn-text" type="button" id="pv-c">Cancelar</button></form>`;
    document.body.appendChild(w);
    const i = w.querySelector('#pv'); setTimeout(() => i.focus(), 50);
    const fim = val => { w.remove(); res(val); };
    w.onclick = e => { if (e.target === w) fim(null); };
    w.querySelector('#pv-c').onclick = () => fim(null);
    w.querySelector('form').onsubmit = e => { e.preventDefault(); fim(parseValor(i.value)); };
  });
}
function naoAchou(){
  $app.innerHTML = `<header style="display:flex;flex-direction:column;gap:6px"><h1 class="t">Não encontrada</h1><span class="sub">Essa viagem ou gasto não existe mais.</span></header>
  <a class="btn" href="#/">Voltar às viagens</a>`;
}

/* ---------- rotas ---------- */
function render(){
  if (!chave) return telaEntrar();
  if (!carregado) { $app.innerHTML = '<div class="spin" role="status" aria-label="Carregando"></div>'; return; }
  const p = (location.hash.replace(/^#\/?/, '') || '').split('/');
  window.scrollTo(0, 0);
  switch (p[0]) {
    case 'v': return telaViagem(p[1], p[2]);
    case 'novo': return telaGasto(p[1] || idAtual(), null);
    case 'gasto': return telaGasto(null, p[1]);
    case 'acerto': return telaAcerto(p[1] || idAtual());
    case 'limite': return telaLimite(p[1] || idAtual());
    case 'nova-viagem': return telaNovaViagem();
    case 'nos': return telaNos();
    default: F = null; return telaViagens();
  }
}
function emFormulario(){ return /^#\/(novo|gasto|nova-viagem|limite)/.test(location.hash) || document.querySelector('.veil') || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)); }

(function iniciar(){
  const m = location.hash.match(/k=([A-Za-z0-9]+)/);
  if (m) { chave = m[1]; store.set('vd_chave', chave); history.replaceState(null, '', location.pathname + '#/'); }
  window.addEventListener('hashchange', () => { if (!/^#\/(novo|gasto)/.test(location.hash)) F = null; render(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && chave && !emFormulario()) carregar(true); });
  setInterval(() => { if (chave && document.visibilityState === 'visible' && !emFormulario()) carregar(true); }, 20000);
  if (chave) carregar(); else render();
})();
</script>
